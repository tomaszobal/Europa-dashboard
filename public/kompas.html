                '<p style="font-size:13px; line-height:1.55; margin:0; color:var(--mut);">' + esc(FACTS[sel.id]) + "</p></div>"
              : "") +
            '<div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px;">' +
            '<div style="padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:#0b1b30;">' +
            '<div class="lbl">Próby w quizach</div>' +
            '<div class="font-display" style="font-size:20px; font-weight:800; margin-top:2px;">' + attempts + "</div></div>" +
            '<div style="padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:#0b1b30;">' +
            '<div class="lbl">Skuteczność</div>' +
            '<div class="font-display" style="font-size:20px; font-weight:800; margin-top:2px; color:' + (acc === null ? "var(--faint)" : acc >= 70 ? "#3ecf8e" : acc >= 40 ? "#f6b94b" : "#f26d6d") + ';">' +
            (acc === null ? "—" : acc + "%") + "</div></div></div>" +
            '<button class="btn ' + (s.learned ? "btn-green" : "btn-ghost") + '" style="width:100%; justify-content:center; margin-top:14px;" data-act="ex-learn" data-id="' + sel.id + '">' +
            (s.learned ? I.check + " Opanowane" : "Oznacz jako opanowane") + "</button></div>";
        }

        html +=
          '<div class="panel" style="padding:16px;">' +
          '<div class="lbl" style="margin-bottom:10px;">Państwa (' + list.length + ")</div>";
        if (list.length === 0) {
          html += '<div style="text-align:center; padding:28px 12px; color:var(--faint); font-size:14px;">' +
            "Brak wyników dla <b style=\"color:var(--ink);\">" + esc(ex.q) + "</b>.<br>" +
            '<button class="btn btn-ghost btn-sm" style="margin-top:12px;" data-act="ex-clear-q">' + I.x + " Wyczyść wyszukiwanie</button></div>";
        } else {
          html += '<div class="nice-scroll" style="max-height:360px; overflow-y:auto; display:flex; flex-direction:column; gap:2px;">';
          list.forEach((c) => {
            const st = statusOf(c.id);
            const dotColor = st === "learned" ? "#3ecf8e" : st === "try" ? "#f6b94b" : "#31517a";
            html +=
              '<button class="row-item' + (ex.sel === c.id ? " row-active" : "") + '" data-act="ex-sel" data-id="' + c.id + '">' +
              '<span style="font-size:17px; line-height:1;">' + flag(c.iso2) + "</span>" +
              '<span style="flex:1; min-width:0;"><span style="display:block; font-size:13.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">' + esc(c.name) + "</span>" +
              '<span style="display:block; font-size:11.5px; color:var(--faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">' + esc(c.capital) + "</span></span>" +
              '<span style="width:8px; height:8px; border-radius:999px; background:' + dotColor + '; flex-shrink:0;"></span></button>';
          });
          html += "</div>";
        }
        html += "</div></div></div>";
        $("#ex-panels").innerHTML = html;
        const grid = $("#ex-panels .ex-grid");
        if (sel && window.innerWidth >= 1024) grid.style.gridTemplateColumns = "360px 1fr";
      }

      function selectCountry(id) {
        ex.sel = id;
        showMark(id);
        paintMap();
        renderExPanels();
      }

      /* ============================================================
         WIDOK: FISZKI
         ============================================================ */
      const fc = {
        phase: "setup", dir: "c2cap", region: "all",
        queue: [], total: 0, flipped: false, knownFirst: 0, firstMiss: new Set(),
        quickId: null
      };

      function fcPool() {
        if (fc.quickId) return [byId[fc.quickId]];
        return COUNTRIES.filter((c) => fc.region === "all" || c.region === fc.region);
      }

      function fcStart() {
        const ids = shuffle(fcPool().map((c) => c.id));
        fc.queue = ids; fc.total = ids.length; fc.flipped = false; fc.knownFirst = 0;
        fc.firstMiss = new Set(); fc.phase = "play";
        renderFc();
      }

      function fcFlip() {
        fc.flipped = !fc.flipped;
        const inner = $("#fc-inner");
        if (inner) inner.classList.toggle("flipped", fc.flipped);
        const b1 = $("#fc-btn-bad"), b2 = $("#fc-btn-good");
        if (b1) b1.disabled = !fc.flipped;
        if (b2) b2.disabled = !fc.flipped;
        const hint = $("#fc-hint");
        if (hint) hint.classList.toggle("hidden", fc.flipped);
      }

      function fcGrade(known) {
        const cur = fc.queue.length ? byId[fc.queue[0]] : null;
        if (!cur) return;
        if (known) {
          if (!fc.firstMiss.has(cur.id)) fc.knownFirst++;
          fc.queue.shift();
        } else {
          fc.firstMiss.add(cur.id);
          fc.queue.push(fc.queue.shift());
        }
        fc.flipped = false;
        renderFc();
      }

      function renderFc() {
        const root = $("#view-fiszki");
        if (fc.phase === "play" && fc.queue.length === 0) fc.phase = "done";
        if (fc.phase === "setup") {
          const pool = fcPool();
          root.innerHTML =
            '<div class="panel animate-popIn" style="max-width:36rem; margin:0 auto; padding:24px;">' +
            '<div class="lbl">Fiszki · trening</div>' +
            '<h2 class="font-display" style="font-size:24px; font-weight:800; margin:6px 0 0;">Odwracaj karty, aż wszystko zostanie w głowie</h2>' +
            '<p style="font-size:14px; color:var(--mut); margin:10px 0 0; line-height:1.6;">' +
            (fc.quickId
              ? "Szybka powtórka: <b style=\"color:var(--amber);\">" + esc(byId[fc.quickId].name) + " → " + esc(byId[fc.quickId].capital) + "</b>. Talia ma 1 kartę — kręć nią, aż wejdzie w krew."
              : "Nieznane karty wracają na koniec kolejki — talia kończy się dopiero, gdy znasz każdą parę.") + "</p>" +
            (fc.quickId ? '<button class="btn btn-ghost btn-sm" style="margin-top:10px;" data-act="fc-unquick">' + I.x + " Wróć do pełnej talii</button>" : "") +
            '<div class="lbl" style="margin-top:22px;">Kierunek</div>' +
            '<div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:6px;">' +
            '<button class="seg' + (fc.dir === "c2cap" ? " seg-on" : "") + '" data-act="fc-dir" data-d="c2cap">Państwo ' + I.arrow + " stolica</button>" +
            '<button class="seg' + (fc.dir === "cap2c" ? " seg-on" : "") + '" data-act="fc-dir" data-d="cap2c">Stolica ' + I.arrow + " państwo</button></div>" +
            '<div class="lbl" style="margin-top:18px;">Zakres</div>' +
            '<div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;">' +
            '<button class="chip' + (fc.region === "all" ? " chip-on" : "") + '" data-act="fc-region" data-r="all">Wszystkie</button>' +
            REGION_ORDER.map((r) => '<button class="chip' + (fc.region === r ? " chip-on" : "") + '" data-act="fc-region" data-r="' + r + '">' + REGIONS[r] + "</button>").join("") +
            "</div>" +
            '<button class="btn btn-amber" style="width:100%; justify-content:center; margin-top:26px;" data-act="fc-start">' +
            I.shuffle + " Tasuj i start (" + pool.length + (pool.length === 1 ? " karta)" : " kart)") + "</button></div>";
          return;
        }
        if (fc.phase === "done") {
          const pct = fc.total ? fc.knownFirst / fc.total : 0;
          const color = pct >= 0.7 ? "#3ecf8e" : "#f6b94b";
          const missed = fc.total - fc.knownFirst;
          root.innerHTML =
            '<div class="panel animate-popIn" style="max-width:36rem; margin:0 auto; padding:28px; text-align:center;">' +
            ringHtml(pct, color, 140, 12,
              '<div class="font-display" style="font-size:28px; font-weight:800;">' + fc.knownFirst + "/" + fc.total + "</div>" +
              '<div style="font-size:10px; text-transform:uppercase; letter-spacing:.12em; color:var(--faint);">za 1. razem</div>') +
            '<h2 class="font-display" style="font-size:24px; font-weight:800; margin:18px 0 0;">Talia rozegrana!</h2>' +
            '<p style="font-size:14px; color:var(--mut); margin:10px 0 0;">' +
            (missed > 0 ? missed + (missed === 1 ? " karta potrzebowała" : " karty potrzebowały") + " powtórki — to właśnie one są teraz w Twojej głowie." : "Wszystkie karty za pierwszym razem — rewelacja!") + "</p>" +
            '<div style="display:flex; justify-content:center; gap:8px; margin-top:22px;">' +
            '<button class="btn btn-amber" data-act="fc-start">' + I.refresh + " Jeszcze raz</button>" +
            '<button class="btn btn-ghost" data-act="fc-setup">Zmień ustawienia</button></div></div>';
          return;
        }
        // play
        const cur = byId[fc.queue[0]];
        const front = fc.dir === "c2cap" ? cur.name : cur.capital;
        const back = fc.dir === "c2cap" ? cur.capital : cur.name;
        const solved = fc.total - fc.queue.length;
        root.innerHTML =
          '<div style="max-width:36rem; margin:0 auto;" class="animate-view">' +
          '<div style="display:flex; align-items:center; gap:12px; margin-bottom:16px;">' +
          '<div style="flex:1; height:8px; border-radius:999px; background:#122440; border:1px solid var(--line); overflow:hidden;">' +
          '<div style="height:100%; background:linear-gradient(90deg,#f6b94b,#3ecf8e); width:' + ((solved / Math.max(1, fc.total)) * 100) + "%; transition:width .5s;\"></div></div>" +
          '<div style="font-size:12px; font-weight:700; color:var(--mut); white-space:nowrap;">zostało ' + fc.queue.length + " / " + fc.total + "</div>" +
          '<button class="icon-btn" data-act="fc-setup" title="Przerwij">' + I.x + "</button></div>" +
          '<div class="flip-card" style="height:300px; cursor:pointer;" data-act="fc-flip" role="button" tabindex="0">' +
          '<div id="fc-inner" class="flip-inner' + (fc.flipped ? " flipped" : "") + '" style="height:100%;">' +
          '<div class="flip-face card-face">' +
          '<div class="lbl">' + (fc.dir === "c2cap" ? "Podaj stolicę" : "Podaj państwo") + "</div>" +
          '<div style="font-size:52px; line-height:1; margin-top:20px;">' + flag(cur.iso2) + "</div>" +
          '<div class="font-display" style="font-size:34px; font-weight:800; margin-top:16px; padding:0 24px; text-align:center;">' + esc(front) + "</div>" +
          (fc.dir === "c2cap" ? '<div style="font-size:11px; text-transform:uppercase; letter-spacing:.16em; color:var(--faint); margin-top:12px;">' + REGION_FULL[cur.region] + "</div>" : "") +
          '<div style="position:absolute; bottom:16px; font-size:11px; color:var(--faint);">kliknij kartę, aby odwrócić</div></div>' +
          '<div class="flip-face flip-back card-face card-back">' +
          '<div class="lbl" style="color:#3ecf8e;">' + (fc.dir === "c2cap" ? "Stolica to" : "To państwo to") + "</div>" +
          '<div class="font-display" style="font-size:36px; font-weight:800; color:#3ecf8e; margin-top:24px; padding:0 24px; text-align:center;">' + esc(back) + "</div>" +
          '<div style="font-size:14px; color:var(--mut); margin-top:12px;">' + flag(cur.iso2) + " " + esc(cur.name) + " → " + esc(cur.capital) + "</div></div></div></div>" +
          '<div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:20px;">' +
          '<button id="fc-btn-bad" class="btn btn-coral" style="justify-content:center; font-size:15px;" data-act="fc-bad"' + (fc.flipped ? "" : " disabled") + ">" + I.x + " Nie znam</button>" +
          '<button id="fc-btn-good" class="btn btn-green" style="justify-content:center; font-size:15px;" data-act="fc-good"' + (fc.flipped ? "" : " disabled") + ">" + I.check + " Znam!</button></div>" +
          '<p id="fc-hint" class="' + (fc.flipped ? "hidden" : "") + '" style="text-align:center; font-size:12px; color:var(--faint); margin:12px 0 0;">Najpierw odwróć kartę i sprawdź się uczciwie.</p></div>';
      }

      /* ============================================================
         WIDOK: QUIZ
         ============================================================ */
      const q = {
        phase: "setup", dir: "c2cap", region: "all", count: 10,
        questions: [], idx: 0, score: 0, streak: 0, locked: false, wrong: []
      };
      let qToken = 0;

      function qBuild() {
        const pool = COUNTRIES.filter((c) => q.region === "all" || c.region === q.region);
        const chosen = shuffle(pool).slice(0, Math.min(q.count, pool.length));
        q.questions = chosen.map((c) => {
          const others = shuffle(pool.filter((o) => o.id !== c.id));
          const opts = q.dir === "c2cap"
            ? shuffle([c.capital, ...others.slice(0, 3).map((o) => o.capital)])
            : shuffle([c.name, ...others.slice(0, 3).map((o) => o.name)]);
          return { c, opts, correct: q.dir === "c2cap" ? c.capital : c.name };
        });
      }

      function qStart() {
        qBuild();
        q.idx = 0; q.score = 0; q.streak = 0; q.wrong = []; q.locked = false; q.phase = "play";
        renderQuiz();
      }

      function qChoose(i) {
        if (q.locked) return;
        q.locked = true;
        const cur = q.questions[q.idx];
        const chosen = cur.opts[i];
        const good = chosen === cur.correct;
        const rec = recordAnswer(cur.c.id, good);
        if (rec.newly) toast(cur.c.name + " — opanowane automatycznie!", "ok");
        if (good) {
          q.score++; q.streak++; bumpStreak(q.streak);
        } else {
          q.streak = 0;
          q.wrong.push({ country: cur.c, given: chosen, correct: cur.correct });
        }
        renderQuiz();
        const myToken = ++qToken;
        setTimeout(() => {
          if (myToken !== qToken || q.phase !== "play") return;
          if (q.idx + 1 >= q.questions.length) {
            addHistory("quiz", q.score, q.questions.length);
            q.phase = "done";
            renderQuiz();
          } else {
            q.idx++; q.locked = false;
            renderQuiz();
          }
        }, 1250);
      }

      function renderQuiz() {
        const root = $("#view-quiz");
        if (q.phase === "setup") {
          const pool = COUNTRIES.filter((c) => q.region === "all" || c.region === q.region);
          root.innerHTML =
            '<div class="panel animate-popIn" style="max-width:36rem; margin:0 auto; padding:24px;">' +
            '<div class="lbl">Quiz · wybór odpowiedzi</div>' +
            '<h2 class="font-display" style="font-size:24px; font-weight:800; margin:6px 0 0;">Sprawdź, co już umiesz</h2>' +
            '<p style="font-size:14px; color:var(--mut); margin:10px 0 0; line-height:1.6;">Możesz klikać albo używać klawiszy <b style="color:var(--ink);">1–4</b>.</p>' +
            '<div class="lbl" style="margin-top:22px;">Pytamy o</div>' +
            '<div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:6px;">' +
            '<button class="seg' + (q.dir === "c2cap" ? " seg-on" : "") + '" data-act="q-dir" data-d="c2cap">stolice</button>' +
            '<button class="seg' + (q.dir === "cap2c" ? " seg-on" : "") + '" data-act="q-dir" data-d="cap2c">państwa</button></div>' +
            '<div class="lbl" style="margin-top:18px;">Zakres</div>' +
            '<div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;">' +
            '<button class="chip' + (q.region === "all" ? " chip-on" : "") + '" data-act="q-region" data-r="all">Wszystkie</button>' +
            REGION_ORDER.map((r) => '<button class="chip' + (q.region === r ? " chip-on" : "") + '" data-act="q-region" data-r="' + r + '">' + REGIONS[r] + "</button>").join("") + "</div>" +
            '<div class="lbl" style="margin-top:18px;">Liczba pytań</div>' +
            '<div style="display:flex; gap:6px; margin-top:6px;">' +
            [8, 10, 15].map((n) => '<button class="chip' + (q.count === n ? " chip-on" : "") + '" data-act="q-count" data-n="' + n + '">' + n + "</button>").join("") + "</div>" +
            '<button class="btn btn-amber" style="width:100%; justify-content:center; margin-top:26px;" data-act="q-start">' +
            I.target + " Start — " + Math.min(q.count, pool.length) + " pytań</button></div>";
          return;
        }
        if (q.phase === "done") {
          root.innerHTML = '<div style="max-width:42rem; margin:0 auto;">' +
            resultHtml(q.score, q.questions.length, q.wrong, "trafione", "q-start") + "</div>";
          return;
        }
        const cur = q.questions[q.idx];
        const promptText = q.dir === "c2cap" ? cur.c.name : cur.c.capital;
        const sub = q.dir === "c2cap" ? "Która to stolica?" : "Stolicą którego państwa jest to miasto?";
        root.innerHTML =
          '<div style="max-width:42rem; margin:0 auto;">' +
          '<div style="display:flex; align-items:center; gap:12px; margin-bottom:14px;">' +
          '<div style="flex:1; height:8px; border-radius:999px; background:#122440; border:1px solid var(--line); overflow:hidden;">' +
          '<div style="height:100%; background:linear-gradient(90deg,#f6b94b,#3ecf8e); width:' + ((q.idx / q.questions.length) * 100) + "%; transition:width .5s;\"></div></div>" +
          '<div style="font-size:12px; font-weight:700; color:var(--mut); white-space:nowrap;">pytanie ' + (q.idx + 1) + "/" + q.questions.length + "</div>" +
          (q.streak >= 2 ? '<span class="font-display" style="display:inline-flex; align-items:center; gap:4px; color:var(--amber); font-weight:800;">' + I.flame + " " + q.streak + "</span>" : "") +
          "</div>" +
          '<div class="panel animate-popIn" style="padding:24px;">' +
          '<div style="display:flex; align-items:center; gap:14px;">' +
          '<span style="font-size:40px; line-height:1;">' + flag(cur.c.iso2) + "</span>" +
          "<div><div style=\"font-size:12px; color:var(--faint); text-transform:uppercase; letter-spacing:.12em; font-weight:700;\">" + sub + "</div>" +
          '<div class="font-display" style="font-size:26px; font-weight:800; line-height:1.15; margin-top:3px;">' + esc(promptText) + "</div></div></div>" +
          '<div style="display:grid; gap:10px; margin-top:20px;">' +
          cur.opts.map((opt, i) => {
            let cls = "opt";
            if (q.locked) {
              if (opt === cur.correct) cls += " opt-good";
              else if (i === q.lastPick) cls += " opt-bad";
              else cls += " opt-dim";
            }
            return '<button class="' + cls + '" data-act="q-opt" data-i="' + i + '"' + (q.locked ? " disabled" : "") + ">" +
              '<span class="opt-letter">' + "ABCD"[i] + "</span><span>" + esc(opt) + "</span>" +
              (q.locked && opt === cur.correct ? '<span style="margin-left:auto; color:#3ecf8e; display:inline-flex;">' + I.check + "</span>" : "") +
              (q.locked && i === q.lastPick && opt !== cur.correct ? '<span style="margin-left:auto; color:#f26d6d; display:inline-flex;">' + I.x + "</span>" : "") +
              "</button>";
          }).join("") + "</div>" +
          '<div id="q-msg" style="margin-top:14px; font-size:13.5px; font-weight:600; min-height:20px;">' + qMsg(cur) + "</div></div></div>";
      }

      function qMsg(cur) {
        if (!q.locked) return '<span style="color:var(--faint); font-weight:500;">Wybierz odpowiedź — klawisze 1–4 też działają.</span>';
        const good = cur.opts[q.lastPick] === cur.correct;
        return good
          ? '<span style="color:#3ecf8e;">' + I.check + " Dobrze!" + (q.streak >= 2 ? " Seria: " + q.streak + "!" : "") + "</span>"
          : '<span style="color:#f26d6d;">' + I.x + " Pudło — poprawna odpowiedź: <b>" + esc(cur.correct) + "</b></span>";
      }

      /* ============================================================
         WIDOK: QUIZ NA MAPIE
         ============================================================ */
      const MQ_ROUNDS = 10;
      const mq = { phase: "setup", targets: [], idx: 0, score: 0, streak: 0, wrong: [], locked: false, msg: null };
      let mqToken = 0, mqTimer = null;

      function mqStart() {
        const pool = COUNTRIES.filter((c) => !MAP_EXCLUDE.has(c.id));
        mq.targets = shuffle(pool).slice(0, MQ_ROUNDS);
        mq.idx = 0; mq.score = 0; mq.streak = 0; mq.wrong = []; mq.locked = false; mq.msg = null;
        mq.phase = "play";
        renderMq();
      }

      function mqAdvance(finalScore, finalWrong) {
        if (mq.idx + 1 >= mq.targets.length) {
          addHistory("mapa", finalScore, mq.targets.length);
          mq.phase = "done";
          renderMq();
        } else {
          mq.idx++; mq.locked = false; mq.msg = null;
          renderMq();
        }
      }

      function mqAnswer(clickedId) {
        if (mq.locked || mq.phase !== "play" || !mq.targets.length) return;
        const target = mq.targets[mq.idx];
        mq.locked = true;
        const myToken = ++mqToken;

        // wyczyść poprzednie efekty
        for (const id in mapNodes) mapNodes[id].classList.remove("fx-good", "fx-bad", "fx-reveal");

        if (clickedId === target.id) {
          mapNodes[target.id] && mapNodes[target.id].classList.add("fx-good");
          mq.streak++; bumpStreak(mq.streak);
          mq.score++;
          mq.msg = { kind: "ok", text: "Tak! To " + target.name + "." };
          const rec = recordAnswer(target.id, true);
          if (rec.newly) toast(target.name + " — opanowane automatycznie!", "ok");
          clearTimeout(mqTimer);
          mqTimer = setTimeout(() => { if (myToken === mqToken) mqAdvance(mq.score, mq.wrong); }, 1300);
        } else {
          mapNodes[target.id] && mapNodes[target.id].classList.add("fx-reveal");
          if (clickedId && mapNodes[clickedId]) mapNodes[clickedId].classList.add("fx-bad");
          mq.streak = 0;
          const given = clickedId ? (byId[clickedId] ? byId[clickedId].name : "inne państwo") : "brak odpowiedzi";
          mq.wrong.push({ country: target, given: given, correct: target.name });
          recordAnswer(target.id, false);
          mq.msg = {
            kind: "bad",
            text: clickedId
              ? "To " + given + " — szukaliśmy: " + target.name + "."
              : "Szukaliśmy: " + target.name + "."
          };
          clearTimeout(mqTimer);
          mqTimer = setTimeout(() => { if (myToken === mqToken) mqAdvance(mq.score, mq.wrong); }, 1900);
        }
        renderMqHud();
      }

      function renderMq() {
        const sec = $("#view-mapquiz");
        sec.appendChild($("#mapwrap"));
        const oldSetup = $("#mq-setup"); if (oldSetup) oldSetup.remove();
        const oldDone = $("#mq-done"); if (oldDone) oldDone.remove();
        if (mq.phase === "setup") {
          $("#mq-hud").innerHTML = "";
          $("#mapwrap").classList.add("hidden");
          sec.insertAdjacentHTML("beforeend",
            '<div id="mq-setup" class="panel animate-popIn" style="max-width:36rem; margin:0 auto; padding:24px;">' +
            '<div class="lbl">Quiz na mapie · ' + MQ_ROUNDS + " rund</div>" +
            '<h2 class="font-display" style="font-size:24px; font-weight:800; margin:6px 0 0;">Pokaż mi to na mapie!</h2>' +
            '<p style="font-size:14px; color:var(--mut); margin:10px 0 0; line-height:1.6;">Dostaniesz nazwę państwa, a Ty klikniesz je na mapie. ' +
            "Bez podpowiedzi po najechaniu — tylko Ty i Europa. Mikropaństwa (jak Watykan czy Monako) pomijamy, bo są mniejsze niż kropka na mapie.</p>" +
            '<button class="btn btn-amber" style="width:100%; justify-content:center; margin-top:26px;" data-act="mq-start">' +
            I.target + " Start — " + MQ_ROUNDS + " państw do znalezienia</button></div>");
          return;
        }
        const setupBox = $("#mq-setup");
        if (setupBox) setupBox.remove();
        $("#mapwrap").classList.remove("hidden");

        if (mq.phase === "done") {
          $("#mq-hud").innerHTML = "";
          $("#mapwrap").classList.add("hidden");
          sec.insertAdjacentHTML("beforeend",
            '<div id="mq-done" style="max-width:42rem; margin:0 auto;">' +
            resultHtml(mq.score, mq.targets.length, mq.wrong, "na mapie", "mq-start") + "</div>");
          paintMap();
          return;
        }
        const doneBox = $("#mq-done");
        if (doneBox) doneBox.remove();
        renderMqHud();
        paintMap();
        renderMapWrap();
      }

      function renderMqHud() {
        const target = mq.targets[mq.idx];
        const msg = mq.msg;
        const msgCls = msg
          ? (msg.kind === "ok"
            ? "border:1px solid rgba(62,207,142,.4); background:rgba(62,207,142,.1); color:#3ecf8e;"
            : "border:1px solid rgba(242,109,109,.4); background:rgba(242,109,109,.1); color:#f26d6d;")
          : "border:1px solid var(--line); background:rgba(11,27,48,.6); color:var(--mut);";
        $("#mq-hud").innerHTML =
          '<div class="panel" style="padding:16px 20px;">' +
          '<div style="display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px;">' +
          "<div><div class=\"lbl\" style=\"margin-bottom:2px;\">Runda " + (mq.idx + 1) + "/" + mq.targets.length + " · znajdź:</div>" +
          '<div class="font-display" style="font-size:24px; font-weight:800; line-height:1.15; display:flex; align-items:center; gap:10px;">' +
          '<span style="font-size:24px;">' + flag(target.iso2) + "</span> " + esc(target.name) + "</div></div>" +
          '<div style="margin-left:auto; display:flex; align-items:center; gap:10px;">' +
          (mq.streak >= 2 ? '<span class="font-display" style="display:inline-flex; align-items:center; gap:4px; color:var(--amber); font-weight:800;">' + I.flame + " " + mq.streak + "</span>" : "") +
          '<span class="chip chip-on" style="pointer-events:none;">' + I.pin + " " + mq.score + " pkt</span>" +
          '<button class="btn btn-ghost btn-sm" data-act="mq-dunno"' + (mq.locked ? " disabled" : "") + ">" + I.x + " Nie wiem</button>" +
          "</div></div>" +
          '<div class="animate-popIn" style="border-radius:12px; padding:10px 16px; margin-top:12px; font-size:14px; font-weight:600; ' + msgCls + '">' +
          (msg
            ? '<span style="display:inline-flex; align-items:center; gap:8px;">' + (msg.kind === "ok" ? I.check : I.x) + esc(msg.text) + "</span>"
            : "Kliknij państwo na mapie. Zielony błysk = trafienie, czerwony = pudło.") + "</div></div>";
      }

      /* ============================================================
         WIDOK: POSTĘPY
         ============================================================ */
      function ringHtml(pct, color, size, stroke, inner) {
        const r = (size - stroke) / 2;
        const c = 2 * Math.PI * r;
        return '<div style="position:relative; display:inline-grid; place-items:center; width:' + size + "px; height:" + size + 'px;">' +
          '<svg width="' + size + '" height="' + size + '" style="transform:rotate(-90deg);">' +
          '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" stroke="#1e3554" stroke-width="' + stroke + '" fill="none"></circle>' +
          '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" stroke="' + color + '" stroke-width="' + stroke + '" fill="none" stroke-linecap="round" ' +
          'stroke-dasharray="' + c + '" stroke-dashoffset="' + (c * (1 - Math.max(0, Math.min(1, pct)))) + '" style="transition:stroke-dashoffset .9s cubic-bezier(.2,.7,.2,1);"></circle>' +
          "</svg>" +
          '<div style="position:absolute; inset:0; display:grid; place-items:center;">' + inner + "</div></div>";
      }

      function resultHtml(score, total, wrong, label, retryAct) {
        const pct = total ? score / total : 0;
        const verdict = pct >= 0.9 ? "Mistrz kompasu!" : pct >= 0.7 ? "Świetna robota!" : pct >= 0.5 ? "Dobry kurs!" : "Jeszcze trochę praktyki!";
        const color = pct >= 0.7 ? "#3ecf8e" : pct >= 0.5 ? "#f6b94b" : "#f26d6d";
        let html =
          '<div class="panel animate-popIn" style="padding:28px;">' +
          '<div style="display:flex; flex-wrap:wrap; align-items:center; gap:28px;">' +
          '<div style="margin:0 auto;">' + ringHtml(pct, color, 150, 13,
            '<div style="text-align:center;"><div class="font-display" style="font-size:34px; font-weight:800; line-height:1;">' + score + "/" + total + "</div>" +
            '<div style="font-size:10px; text-transform:uppercase; letter-spacing:.14em; color:var(--faint); margin-top:4px;">' + label + "</div></div>") + "</div>" +
          '<div style="flex:1; min-width:240px; text-align:center;">' +
          '<div style="display:flex; align-items:center; justify-content:center; gap:8px; color:#f6b94b;">' + I.trophy +
          '<span class="font-display" style="font-size:24px; font-weight:800; color:var(--ink);">' + verdict + "</span></div>" +
          '<p style="font-size:14px; color:var(--mut); margin:10px 0 0; line-height:1.6;">' +
          (pct >= 0.7 ? "Tak trzymaj — mapa Europy nie ma przed Tobą tajemnic." : "Zajrzyj na mapę, podpatrz trudne państwa i spróbuj jeszcze raz.") + "</p>" +
          '<div style="display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-top:18px;">' +
          '<button class="btn btn-amber" data-act="' + retryAct + '">' + I.refresh + " Zagraj ponownie</button>" +
          '<button class="btn btn-ghost" data-act="nav" data-mode="mapa">' + I.map + " Wróć do mapy</button></div></div></div>";
        if (wrong.length) {
          html += '<div style="margin-top:26px;"><div class="lbl" style="margin-bottom:10px;">Do powtórki (' + wrong.length + ")</div>" +
            '<div style="display:grid; gap:8px; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));">' +
            wrong.map((w) =>
              '<div style="display:flex; align-items:center; gap:12px; border-radius:10px; background:rgba(11,27,48,.7); border:1px solid var(--line); padding:10px 14px;">' +
              '<span style="font-size:18px; line-height:1;">' + flag(w.country.iso2) + "</span>" +
              '<div style="min-width:0;"><div style="font-size:13.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">' + esc(w.country.name) + "</div>" +
              '<div style="font-size:12px; color:var(--faint);">' +
              (w.given ? '<span style="color:#f26d6d; text-decoration:line-through;">' + esc(w.given) + "</span> " + I.arrow + " " : "") +
              '<span style="color:#3ecf8e; font-weight:600;">' + esc(w.correct) + "</span></div></div></div>"
            ).join("") + "</div></div>";
        }
        return html + "</div>";
      }

      function renderProgress() {
        const root = $("#view-postepy");
        const n = learnedCount();
        const pct = n / COUNTRIES.length;
        const attempts = COUNTRIES.reduce((a, c) => { const s = stat(c.id); return a + s.c + s.w; }, 0);
        const quizCount = store.history.length;
        const avg = quizCount
          ? Math.round((store.history.reduce((a, r) => a + r.score / Math.max(1, r.total), 0) / quizCount) * 100)
          : null;
        const regionStats = REGION_ORDER.map((r) => {
          const cs = COUNTRIES.filter((c) => c.region === r);
          return { r: r, total: cs.length, learned: cs.filter((c) => stat(c.id).learned).length };
        });
        const sorted = [...COUNTRIES].sort((a, b) => a.name.localeCompare(b.name, "pl"));

        root.innerHTML =
          '<div style="display:grid; gap:20px;">' +
          '<div style="display:grid; gap:20px; align-items:stretch;" class="pg-head">' +
          '<div class="panel" style="padding:24px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;">' +
          ringHtml(pct, pct >= 0.66 ? "#3ecf8e" : "#f6b94b", 150, 13,
            '<div><div class="font-display" style="font-size:32px; font-weight:800; line-height:1;">' + Math.round(pct * 100) + '%</div>' +
            '<div style="font-size:10px; text-transform:uppercase; letter-spacing:.16em; color:var(--faint); margin-top:4px;">mapy Europy</div></div>') +
          '<div style="margin-top:12px; font-size:14px; color:var(--mut);"><b style="color:var(--ink);">' + n + "</b> z <b style=\"color:var(--ink);\">" + COUNTRIES.length + "</b> państw opanowanych</div></div>" +
          '<div class="pg-tiles" style="display:grid; gap:12px;">' +
          tileHtml(I.trophy, "#3ecf8e", String(n), "opanowane") +
          tileHtml(I.quiz, "#58b4e8", String(quizCount), "quizy i gry") +
          tileHtml(I.target, "#f6b94b", avg === null ? "—" : avg + "%", "średni wynik") +
          tileHtml(I.flame, "#f6b94b", String(store.bestStreak), "najlepsza seria") +
          '<div class="panel pg-reg" style="padding:16px;">' +
          '<div class="lbl" style="margin-bottom:12px;">Postęp według regionów</div>' +
          '<div class="pg-regbars" style="display:grid; gap:12px;">' +
          regionStats.map((rs) =>
            "<div><div style=\"display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px;\">" +
            '<span style="font-weight:700;">' + REGIONS[rs.r] + "</span>" +
            '<span style="color:var(--faint);">' + rs.learned + "/" + rs.total + "</span></div>" +
            '<div style="height:10px; border-radius:999px; background:#0b1b30; border:1px solid var(--line); overflow:hidden;">' +
            '<div style="height:100%; width:' + ((rs.learned / rs.total) * 100) + "%; border-radius:999px; transition:width .7s; background:" +
            (rs.learned === rs.total ? "linear-gradient(90deg,#2f9e77,#3ecf8e)" : "linear-gradient(90deg,#c98f2c,#f6b94b)") + ';"></div></div></div>'
          ).join("") + "</div></div></div></div></div>" +

          '<div class="panel" style="padding:20px;">' +
          '<div style="display:flex; flex-wrap:wrap; align-items:center; gap:8px 16px; margin-bottom:16px;">' +
          '<div class="lbl">Wszystkie państwa — kliknij, by oznaczyć</div>' +
          '<div style="margin-left:auto; display:flex; gap:16px; font-size:12px; color:var(--mut);">' +
          '<span style="display:inline-flex; align-items:center; gap:6px;"><i style="width:10px; height:10px; border-radius:4px; background:#31517a; display:inline-block;"></i> nowe</span>' +
          '<span style="display:inline-flex; align-items:center; gap:6px;"><i style="width:10px; height:10px; border-radius:4px; background:#f6b94b; display:inline-block;"></i> w trakcie</span>' +
          '<span style="display:inline-flex; align-items:center; gap:6px;"><i style="width:10px; height:10px; border-radius:4px; background:#3ecf8e; display:inline-block;"></i> opanowane</span>' +
          "</div></div>" +
          '<div class="pg-countries" style="display:grid; gap:8px;">' +
          sorted.map((c) => {
            const st = statusOf(c.id);
            const bcls = st === "learned"
              ? "border:1px solid rgba(62,207,142,.35); background:rgba(62,207,142,.08);"
              : st === "try"
              ? "border:1px solid rgba(246,185,75,.3); background:rgba(246,185,75,.06);"
              : "border:1px solid var(--line); background:rgba(11,27,48,.5);";
            const dot = st === "learned" ? "#3ecf8e" : st === "try" ? "#f6b94b" : "#31517a";
            return '<button data-act="pg-toggle" data-id="' + c.id + '" style="display:flex; align-items:center; gap:10px; border-radius:10px; padding:8px 12px; cursor:pointer; text-align:left; color:var(--ink); transition:transform .15s; ' + bcls + '">' +
              '<span style="font-size:18px; line-height:1;">' + flag(c.iso2) + "</span>" +
              '<span style="flex:1; min-width:0;"><span style="display:block; font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">' + esc(c.name) + "</span>" +
              '<span style="display:block; font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:' + (st === "learned" ? "#3ecf8e" : "var(--faint)") + ';">' + esc(c.capital) + "</span></span>" +
              '<span style="width:8px; height:8px; border-radius:999px; background:' + dot + '; flex-shrink:0;"></span></button>';
          }).join("") + "</div></div>" +

          '<div class="pg-bottom" style="display:grid; gap:20px; align-items:start;">' +
          '<div class="panel" style="padding:20px;">' +
          '<div class="lbl" style="margin-bottom:12px;">Ostatnie quizy i gry</div>' +
          (store.history.length === 0
            ? '<div style="font-size:14px; color:var(--faint); padding:24px 0; text-align:center;">Jeszcze brak wyników. Zagraj w <b style="color:#f6b94b;">Quiz</b> lub <b style="color:#f6b94b;">Quiz na mapie</b> — wyniki pojawią się tutaj.</div>'
            : '<div style="display:flex; flex-direction:column; gap:8px;">' +
              store.history.slice(0, 8).map((r) => {
                const p = r.score / Math.max(1, r.total);
                const d = new Date(r.date);
                const ds = d.toLocaleDateString("pl-PL", { day: "numeric", month: "short" }) + ", " + d.toLocaleTimeString("pl-PL", { hour: "2-digit", minute: "2-digit" });
                return '<div style="display:flex; align-items:center; gap:12px; border-radius:10px; background:rgba(11,27,48,.6); border:1px solid var(--line); padding:10px 14px;">' +
                  '<span class="chip" style="pointer-events:none;">' + (r.mode === "mapa" ? I.pin + " na mapie" : I.quiz + " quiz") + "</span>" +
                  '<div style="flex:1; height:8px; border-radius:999px; background:#122440; overflow:hidden;">' +
                  '<div style="height:100%; width:' + (p * 100) + "%; background:" + (p >= 0.7 ? "#3ecf8e" : p >= 0.5 ? "#f6b94b" : "#f26d6d") + ';"></div></div>' +
                  '<span class="font-display" style="font-weight:800; font-size:14px; width:48px; text-align:right;">' + r.score + "/" + r.total + "</span>" +
                  '<span style="font-size:11px; color:var(--faint); white-space:nowrap;">' + ds + "</span></div>";
              }).join("") + "</div>") +
          "</div>" +
          '<div class="panel" style="padding:20px;">' +
          '<div class="lbl" style="margin-bottom:8px;">Licznik prób</div>' +
          '<div class="font-display" style="font-size:36px; font-weight:800;">' + attempts + "</div>" +
          '<p style="font-size:12px; color:var(--faint); margin:6px 0 0; line-height:1.55;">Tyle razy odpowiadałeś w quizach. Każda odpowiedź — dobra czy zła — buduje Twoją mapę w głowie.</p>' +
          '<div style="height:1px; background:var(--line); margin:16px 0;"></div>' +
          '<div class="lbl" style="margin-bottom:8px; color:#f26d6d;">Niebezpieczna strefa</div>' +
          '<button class="btn btn-coral" style="width:100%; justify-content:center;" data-act="reset-open">' + I.refresh + " Wyzeruj cały postęp</button>" +
          "</div></div></div>";

        // responsywne siatki
        const head = root.querySelector(".pg-head");
        if (window.innerWidth >= 1024) head.style.gridTemplateColumns = "auto 1fr";
        const tiles = root.querySelector(".pg-tiles");
        tiles.style.gridTemplateColumns = window.innerWidth >= 1280 ? "repeat(4, 1fr)" : window.innerWidth >= 640 ? "repeat(2, 1fr)" : "repeat(2, 1fr)";
        const reg = root.querySelector(".pg-reg");
        reg.style.gridColumn = "1 / -1";
        const bars = root.querySelector(".pg-regbars");
        if (window.innerWidth >= 640) bars.style.gridTemplateColumns = "1fr 1fr";
        const pgc = root.querySelector(".pg-countries");
        pgc.style.gridTemplateColumns = window.innerWidth >= 1280 ? "repeat(4, 1fr)" : window.innerWidth >= 1024 ? "repeat(3, 1fr)" : window.innerWidth >= 640 ? "repeat(2, 1fr)" : "1fr";
        const bottom = root.querySelector(".pg-bottom");
        if (window.innerWidth >= 1024) bottom.style.gridTemplateColumns = "1fr 320px";
      }

      function tileHtml(icon, color, value, label) {
        return '<div class="panel" style="padding:16px; display:flex; flex-direction:column; justify-content:space-between; min-height:96px;">' +
          '<span style="color:' + color + '; display:inline-flex;">' + icon + "</span>" +
          '<div style="margin-top:8px;"><div class="font-display" style="font-size:26px; font-weight:800; line-height:1;">' + value + "</div>" +
          '<div style="font-size:10px; text-transform:uppercase; letter-spacing:.14em; color:var(--faint); margin-top:4px;">' + label + "</div></div></div>";
      }

      /* ---------------- modal resetu ---------------- */
      function openResetModal() {
        $("#modal").classList.remove("hidden");
        $("#modal").innerHTML =
          '<div class="veil" data-act="reset-cancel"></div>' +
          '<div class="mcard panel">' +
          '<div style="display:flex; justify-content:space-between; gap:16px; margin-bottom:12px;">' +
          '<h3 class="font-display" style="font-size:20px; font-weight:800; margin:0;">Na pewno wyzerować?</h3>' +
          '<button class="icon-btn" data-act="reset-cancel" aria-label="Zamknij">' + I.x + "</button></div>" +
          '<div style="font-size:14px; color:var(--mut); line-height:1.6;">Znikną wszystkie opanowane państwa, wyniki quizów i rekord serii (' +
          store.bestStreak + "). Tej operacji nie można cofnąć.</div>" +
          '<div style="display:flex; justify-content:flex-end; gap:8px; margin-top:24px;">' +
          '<button class="btn btn-ghost" data-act="reset-cancel">Zostawiam</button>' +
          '<button class="btn btn-coral" data-act="reset-confirm">' + I.refresh + " Tak, zeruję</button></div></div>";
      }
      function closeResetModal() {
        $("#modal").classList.add("hidden");
        $("#modal").innerHTML = "";
      }

      /* ---------------- globalna delegacja zdarzeń ---------------- */
      document.addEventListener("click", (e) => {
        const b = e.target && e.target.closest ? e.target.closest("[data-act]") : null;
        if (!b || b.disabled) return;
        const act = b.dataset.act;
        switch (act) {
          case "nav": {
            clearTimeout(mqTimer); mqToken++; qToken++;
            setView(b.dataset.mode);
            break;
          }
          case "map-retry": loadMap(); break;

          case "ex-region": ex.region = b.dataset.r; renderExplore(); break;
          case "ex-caps": ex.showCaps = !ex.showCaps; applyToggles(); renderExplore(); break;
          case "ex-names": ex.showNames = !ex.showNames; applyToggles(); renderExplore(); break;
          case "ex-capnames": ex.showCapNames = !ex.showCapNames; applyToggles(); renderExplore(); break;
          case "ex-tips": ex.tooltips = !ex.tooltips; renderExplore(); break;
          case "zoom-in": if (mapSvg) zoomAt(W / 2, H / 2, 1.4); break;
          case "zoom-out": if (mapSvg) zoomAt(W / 2, H / 2, 1 / 1.4); break;
          case "zoom-reset": zm.k = 1; zm.tx = 0; zm.ty = 0; applyZoom(); break;
          case "ex-import": fileInput.click(); break;
          case "map-reset-custom":
            try { localStorage.removeItem(CUSTOM_KEY); } catch (e2) {}
            customMemory = null;
            toast("Wracam do domyślnej mapy…", "info");
            loadMap();
            break;
          case "ex-sel": selectCountry(b.dataset.id); break;
          case "ex-clear-sel": ex.sel = null; hideMark(); paintMap(); renderExPanels(); break;
          case "ex-clear-q": ex.q = ""; renderExplore(); break;
          case "ex-learn": {
            const on = toggleLearned(b.dataset.id);
            const c = byId[b.dataset.id];
            toast(c.name + (on ? " — opanowane" : " — wraca do nauki"), on ? "ok" : "info");
            renderExPanels();
            break;
          }
          case "fc-quick": fc.quickId = b.dataset.id; fc.phase = "setup"; setView("fiszki"); break;

          case "fc-dir": fc.dir = b.dataset.d; renderFc(); break;
          case "fc-region": fc.quickId = null; fc.region = b.dataset.r; renderFc(); break;
          case "fc-start": fcStart(); break;
          case "fc-setup": fc.quickId = null; fc.phase = "setup"; renderFc(); break;
          case "fc-unquick": fc.quickId = null; renderFc(); break;
          case "fc-flip": fcFlip(); break;
          case "fc-bad": fcGrade(false); break;
          case "fc-good": fcGrade(true); break;

          case "q-dir": q.dir = b.dataset.d; renderQuiz(); break;
          case "q-region": q.region = b.dataset.r; renderQuiz(); break;
          case "q-count": q.count = parseInt(b.dataset.n, 10); renderQuiz(); break;
          case "q-start": qStart(); break;
          case "q-opt": q.lastPick = parseInt(b.dataset.i, 10); qChoose(q.lastPick); break;

          case "mq-start": mqStart(); break;
          case "mq-dunno": mqAnswer(null); break;

          case "pg-toggle": {
            const on = toggleLearned(b.dataset.id);
            const c = byId[b.dataset.id];
            toast(c.name + (on ? " — opanowane" : " — wraca do nauki"), on ? "ok" : "info");
            renderProgress();
            break;
          }
          case "reset-open": openResetModal(); break;
          case "reset-cancel": closeResetModal(); break;
          case "info-close": closeResetModal(); break;
          case "reset-confirm":
            resetAll();
            closeResetModal();
            toast("Postęp wyzerowany — nowa przygoda!", "warn");
            renderProgress();
            break;
        }
      });

      // klik w mapę
      document.addEventListener("click", (e) => {
        if (mapState !== "ready") return;
        if (justDragged) { justDragged = false; return; }
        const t = e.target.closest ? e.target.closest("[data-id]") : null;
        if (!t || !$("#mapwrap").contains(t)) return;
        const id = t.dataset.id;
        if (view === "mapa") selectCountry(id);
        else if (view === "mapquiz") mqAnswer(id);
      });

      // wyszukiwarka
      document.addEventListener("input", (e) => {
        if (e.target && e.target.id === "ex-search") {
          ex.q = e.target.value;
          renderExPanels();
        }
      });

      // klawiatura: 1-4 w quizie, Enter/Spacja na fiszce
      document.addEventListener("keydown", (e) => {
        if (view === "quiz" && q.phase === "play" && !q.locked && !e.ctrlKey && !e.metaKey && !e.altKey) {
          const k = parseInt(e.key, 10);
          if (k >= 1 && k <= 4) {
            q.lastPick = k - 1;
            qChoose(k - 1);
          }
        }
        if (view === "fiszki" && fc.phase === "play" && (e.key === "Enter" || e.key === " ")) {
          if (e.target.closest && e.target.closest(".flip-card")) {
            e.preventDefault();
            fcFlip();
          }
        }
      });

      // zmiana rozmiaru okna — przelicz siatki
      let rsz;
      window.addEventListener("resize", () => {
        clearTimeout(rsz);
        rsz = setTimeout(() => {
          if (view === "mapa") renderExPanels();
          else if (view === "postepy") renderProgress();
        }, 200);
      });

      /* ---------------- wybór i upuszczanie pliku z mapą ---------------- */
      const fileInput = document.createElement("input");
      fileInput.type = "file";
      fileInput.accept = ".json,.geojson,.topojson,.html,.htm,application/json,application/geo+json,text/html";
      fileInput.style.display = "none";
      document.body.appendChild(fileInput);
      fileInput.addEventListener("change", () => {
        if (fileInput.files && fileInput.files[0]) handleMapFile(fileInput.files[0]);
        fileInput.value = "";
      });

      ["dragover", "dragenter"].forEach((ev) =>
        document.addEventListener(ev, (e) => {
          const types = e.dataTransfer ? e.dataTransfer.types : null;
          if (types && Array.prototype.indexOf.call(types, "Files") !== -1) {
            e.preventDefault();
            const w = $("#mapwrap");
            if (w) w.classList.add("drop-hot");
          }
        })
      );
      document.addEventListener("dragleave", (e) => {
        if (!e.relatedTarget) {
          const w = $("#mapwrap");
          if (w) w.classList.remove("drop-hot");
        }
      });
      document.addEventListener("drop", (e) => {
        const w = $("#mapwrap");
        if (w) w.classList.remove("drop-hot");
        if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
          e.preventDefault();
          handleMapFile(e.dataTransfer.files[0]);
        }
      });

      /* ---------------- start ---------------- */
      buildNav();
      const tipEl = $("#tip");
      let tipI = 0;
      tipEl.textContent = TIPS[0];
      setInterval(() => {
        tipI = (tipI + 1) % TIPS.length;
        tipEl.classList.remove("animate-fadeIn");
        void tipEl.offsetWidth;
        tipEl.textContent = TIPS[tipI];
        tipEl.classList.add("animate-fadeIn");
      }, 8000);

      setView("mapa");
      loadMap();
    </script>
  </body>
</html>
