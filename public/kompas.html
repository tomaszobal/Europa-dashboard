<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kompas — Atlas Europy · państwa i stolice</title>
    <meta
      name="description"
      content="Interaktywny dashboard do nauki mapy Europy: państwa, stolice, fiszki i quizy dla szóstoklasisty. Jeden plik HTML — działa po otwarciu w przeglądarce."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Manrope:wght@400..800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0a1626;
        --panel: #101f36;
        --line: #1e3554;
        --ink: #e9f2fb;
        --mut: #94aac6;
        --faint: #647d9e;
        --amber: #f6b94b;
        --green: #3ecf8e;
        --coral: #f26d6d;
        --sky: #58b4e8;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background-color: var(--bg);
        color: var(--ink);
        font-family: "Manrope", "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      body::before {
        content: "";
        position: fixed; inset: 0; z-index: 0; pointer-events: none;
        background-image: radial-gradient(#16304e 1px, transparent 1px);
        background-size: 26px 26px;
        opacity: 0.33;
      }
      body::after {
        content: "";
        position: fixed; inset: 0; z-index: 0; pointer-events: none;
        background:
          radial-gradient(720px 430px at 10% -8%, rgba(246, 185, 75, 0.07), transparent 62%),
          radial-gradient(820px 540px at 106% 110%, rgba(62, 207, 142, 0.06), transparent 62%);
      }
      ::selection { background: rgba(246, 185, 75, 0.35); }
      button { font-family: inherit; }
      .font-display { font-family: "Bricolage Grotesque", "Manrope", sans-serif; }
      .hidden { display: none !important; }

      .app { position: relative; z-index: 1; min-height: 100vh; }
      @media (min-width: 768px) { .app { display: grid; grid-template-columns: 256px 1fr; } }

      .panel {
        background: linear-gradient(180deg, #122440, #0e1d33);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: 0 12px 32px rgba(3, 10, 20, 0.35);
      }
      .lbl {
        display: block; font-size: 10.5px; letter-spacing: 0.16em;
        text-transform: uppercase; color: var(--faint); font-weight: 700;
      }
      .chip {
        display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;
        color: var(--mut); background: #0b1b30; border: 1px solid var(--line);
        padding: 5px 11px; border-radius: 999px; cursor: pointer; transition: all 0.2s;
      }
      .chip:hover { border-color: #31517a; color: var(--ink); }
      .chip-on { color: #0a1626; background: var(--amber); border-color: var(--amber); font-weight: 800; }
      .chip-on:hover { color: #0a1626; border-color: var(--amber); }
      .btn {
        display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px;
        border-radius: 12px; padding: 10px 18px; border: 1px solid transparent; cursor: pointer; transition: all 0.18s;
      }
      .btn:active { transform: translateY(1px) scale(0.99); }
      .btn:disabled { opacity: 0.4; pointer-events: none; }
      .btn-amber { background: var(--amber); color: #0a1626; box-shadow: 0 6px 18px rgba(246, 185, 75, 0.25); }
      .btn-amber:hover { background: #ffcf70; transform: translateY(-1px); }
      .btn-green { background: var(--green); color: #07271a; }
      .btn-green:hover { background: #5fdca4; transform: translateY(-1px); }
      .btn-coral { background: rgba(242, 109, 109, 0.12); color: var(--coral); border-color: rgba(242, 109, 109, 0.4); }
      .btn-coral:hover { background: rgba(242, 109, 109, 0.2); }
      .btn-ghost { background: #0b1b30; color: var(--mut); border-color: var(--line); }
      .btn-ghost:hover { color: var(--ink); border-color: #31517a; transform: translateY(-1px); }
      .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 10px; }
      .icon-btn {
        display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 9px;
        border: 1px solid var(--line); background: #0b1b30; color: var(--mut); cursor: pointer; transition: all 0.18s; flex-shrink: 0;
      }
      .icon-btn:hover { color: var(--ink); border-color: #31517a; }
      .input {
        width: 100%; background: #0b1b30; border: 1px solid var(--line); border-radius: 11px;
        padding: 9px 12px; font-size: 14px; color: var(--ink); outline: none; transition: border-color 0.2s, box-shadow 0.2s;
      }
      .input::placeholder { color: var(--faint); }
      .input:focus { border-color: var(--amber); box-shadow: 0 0 0 3px rgba(246, 185, 75, 0.15); }
      .seg {
        display: flex; align-items: center; justify-content: center; gap: 7px; padding: 10px; border-radius: 11px;
        border: 1px solid var(--line); background: #0b1b30; color: var(--mut); font-size: 13px; font-weight: 700;
        cursor: pointer; transition: all 0.18s;
      }
      .seg:hover { color: var(--ink); border-color: #31517a; }
      .seg-on { background: rgba(246, 185, 75, 0.12); border-color: rgba(246, 185, 75, 0.55); color: var(--amber); }
      .nav-item {
        display: flex; align-items: center; gap: 11px; width: 100%; padding: 10px 12px; border-radius: 11px;
        font-size: 14px; font-weight: 600; color: var(--mut); border: 1px solid transparent; cursor: pointer;
        transition: all 0.18s; text-align: left; background: transparent;
      }
      .nav-item:hover { color: var(--ink); background: #10233d; }
      .nav-on { color: var(--amber); background: rgba(246, 185, 75, 0.09); border-color: rgba(246, 185, 75, 0.3); }
      .nav-chip {
        display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 12.5px; font-weight: 700;
        color: var(--mut); background: #0b1b30; border: 1px solid var(--line); padding: 7px 12px; border-radius: 10px;
        cursor: pointer; transition: all 0.18s;
      }
      .nav-chip-on { color: #0a1626; background: var(--amber); border-color: var(--amber); }
      .row-item {
        display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border-radius: 10px;
        border: 1px solid transparent; cursor: pointer; transition: all 0.15s; background: transparent; color: var(--ink); text-align: left;
      }
      .row-item:hover { background: #0b1b30; }
      .row-active { background: rgba(246, 185, 75, 0.08); border-color: rgba(246, 185, 75, 0.35); }
      .opt {
        display: flex; align-items: center; gap: 12px; padding: 13px 15px; border-radius: 12px;
        border: 1px solid var(--line); background: #0b1b30; cursor: pointer; transition: all 0.16s;
        font-size: 15px; color: var(--ink); text-align: left; width: 100%;
      }
      .opt:hover:not(:disabled) { border-color: var(--amber); transform: translateY(-1px); }
      .opt-letter {
        display: grid; place-items: center; width: 26px; height: 26px; border-radius: 8px;
        background: #122440; border: 1px solid var(--line); font-family: "Bricolage Grotesque", sans-serif;
        font-weight: 800; font-size: 12px; color: var(--faint); flex-shrink: 0;
      }
      .opt-good { border-color: var(--green); background: rgba(62, 207, 142, 0.14); }
      .opt-good .opt-letter { background: var(--green); color: #07271a; border-color: var(--green); }
      .opt-bad { border-color: var(--coral); background: rgba(242, 109, 109, 0.12); animation: shake 0.4s; }
      .opt-bad .opt-letter { background: var(--coral); color: #2b0c0c; border-color: var(--coral); }
      .opt-dim { opacity: 0.4; }

      /* ------- układ ------- */
      .side {
        display: none; flex-direction: column; gap: 20px; position: sticky; top: 0; height: 100vh;
        border-right: 1px solid #16304e; background: rgba(12, 26, 46, 0.85); padding: 24px 16px; overflow-y: auto;
      }
      @media (min-width: 768px) { .side { display: flex; } }
      .logo { display: flex; align-items: center; gap: 12px; padding: 0 4px; }
      .logo-badge {
        display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: var(--amber);
        color: #0a1626; box-shadow: 0 6px 18px rgba(246, 185, 75, 0.3);
      }
      .logo-name { font-family: "Bricolage Grotesque"; font-size: 18px; font-weight: 800; letter-spacing: 0.06em; line-height: 1; }
      .logo-sub { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.22em; color: var(--faint); margin-top: 5px; }
      .side-nav { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
      .side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 14px; }
      .m-top {
        position: sticky; top: 0; z-index: 40; border-bottom: 1px solid #16304e;
        background: rgba(12, 26, 46, 0.95); padding: 12px 16px 10px;
      }
      @media (min-width: 768px) { .m-top { display: none; } }
      .m-nav { display: flex; gap: 6px; margin-top: 12px; overflow-x: auto; padding-bottom: 2px; }
      .maincol { min-width: 0; }
      header.top {
        padding: 24px 20px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px; justify-content: space-between;
      }
      @media (min-width: 640px) { header.top { padding: 24px 32px 20px; } }
      header.top h1 {
        font-family: "Bricolage Grotesque"; font-size: 27px; font-weight: 800; line-height: 1.15; margin: 0;
      }
      header.top .sub { font-size: 14px; color: var(--mut); margin: 5px 0 0; }
      .hdr-chips { display: flex; align-items: center; gap: 10px; }
      .hdr-chip {
        display: flex; align-items: center; gap: 10px; border-radius: 12px; padding: 6px 12px; border: 1px solid rgba(246, 185, 75, 0.25);
        background: rgba(246, 185, 75, 0.08);
      }
      .hdr-chip.streak { border-color: rgba(242, 109, 109, 0.25); background: rgba(242, 109, 109, 0.08); padding: 10px 12px; }
      .hdr-chip b { font-family: "Bricolage Grotesque"; font-size: 14px; display: block; line-height: 1.1; }
      .hdr-chip small { display: block; font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--faint); margin-top: 2px; }
      main.content { padding: 0 20px 80px; }
      @media (min-width: 640px) { main.content { padding: 0 32px 80px; } }

      /* ------- mapa ------- */
      .mapwrap {
        position: relative; border-radius: 16px; border: 1px solid var(--line); overflow: hidden;
        background: #d7edf9; box-shadow: 0 12px 32px rgba(3, 10, 20, 0.35);
      }
      .map-svg { display: block; width: 100%; height: auto; --k: 1; touch-action: none; cursor: grab; }
      .map-svg.dragging { cursor: grabbing; }
      #mapwrap.drop-hot { outline: 3px dashed rgba(246, 185, 75, 0.65); outline-offset: -7px; }
      .sea-outline { stroke: #a7c9dd; stroke-width: 1.1; }
      .graticule { fill: none; stroke: #bcd8e8; stroke-width: calc(0.7 / var(--k) * 1px); stroke-dasharray: 2 6; opacity: 0.9; }
      .ctx { fill: #e6dfd0; stroke: #c9c0ae; stroke-width: calc(0.6 / var(--k) * 1px); }
      .eu {
        fill: #faf4e3; stroke: #83796a; stroke-width: calc(1.1 / var(--k) * 1px); stroke-linejoin: round;
        cursor: pointer; transition: fill 0.15s;
      }
      .eu-new { fill: #faf4e3; }
      .eu-try { fill: #ffe3ae; }
      .eu-learned { fill: #cdeed9; }
      .eu-q { fill: #faf4e3; }
      .eu:hover { fill: #ffd48c; }
      .eu-sel { fill: #ffb454 !important; stroke: #7a4b00 !important; stroke-width: calc(1.8 / var(--k) * 1px) !important; }
      .eu-dot { stroke: #7a4b00; stroke-width: calc(1 / var(--k) * 1px); }
      .mark-ring { fill: none; stroke: #d97706; stroke-width: calc(2 / var(--k) * 1px); stroke-dasharray: 3 4; opacity: 0.9; }
      .cap circle.capdot { fill: #b2262f; stroke: #fff; stroke-width: calc(0.9 / var(--k) * 1px); }
      .cap:hover circle.capdot { fill: #ff5a45; }
      .cap .hit { fill: transparent; cursor: pointer; }
      .caps-off .cap { display: none; }
      .mname, .cname {
        pointer-events: none; text-anchor: middle; paint-order: stroke; stroke-linejoin: round;
        font-family: "Manrope", sans-serif; font-weight: 700;
      }
      .mname { fill: #1f2c36; stroke: rgba(250, 244, 227, 0.92); stroke-width: calc(3 / var(--k) * 1px); font-size: calc(11.5 / var(--k) * 1px); }
      .cname { fill: #8a1b23; stroke: rgba(250, 244, 227, 0.92); stroke-width: calc(2.6 / var(--k) * 1px); font-size: calc(9.5 / var(--k) * 1px); }
      .names-off .mname { display: none; }
      .capnames-off .cname { display: none; }
      #zoomBtns { position: absolute; left: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 6px; z-index: 6; }
      #zoomBtns button {
        width: 36px; height: 36px; border-radius: 9px; border: 1px solid var(--line); background: #fff;
        font-size: 18px; font-weight: 700; color: var(--ink); cursor: pointer; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
        display: grid; place-items: center; transition: background 0.15s;
      }
      #zoomBtns button:hover { background: #f0f6fa; }
      #hintBar {
        position: absolute; left: 50%; transform: translateX(-50%); bottom: 12px; z-index: 5;
        background: rgba(255, 255, 255, 0.94); border: 1px solid #d3dfe8; border-radius: 999px;
        padding: 6px 16px; font-size: 12.5px; color: #5c6b78; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
        max-width: 72%; text-align: center; pointer-events: none;
      }
      @media (max-width: 640px) { #hintBar { font-size: 11px; padding: 5px 12px; } }
      .map-tip {
        position: absolute; z-index: 30; pointer-events: none; background: rgba(31, 44, 54, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 10px; padding: 8px 12px;
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.5); max-width: 240px; color: #fff;
      }
      .map-loading, .map-error {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; padding: 80px 20px; color: var(--mut); text-align: center;
      }
      .spinner {
        width: 42px; height: 42px; border-radius: 50%; border: 3px solid #1e3554; border-top-color: var(--amber);
        animation: spin 0.9s linear infinite;
      }
      .fx-good { animation: fxGood 1s ease both; }
      .fx-bad { animation: fxBad 1s ease both; }
      .fx-reveal { fill: #ffd166 !important; stroke: #7a4b00 !important; animation: pulseR 1.1s ease-in-out infinite; }
      .compass-spin { animation: spin 80s linear infinite; transform-box: fill-box; transform-origin: center; }

      /* ------- fiszki ------- */
      .flip-card { perspective: 1400px; }
      .flip-inner { position: relative; height: 100%; transform-style: preserve-3d; transition: transform 0.55s cubic-bezier(0.2, 0.7, 0.2, 1); }
      .flip-inner.flipped { transform: rotateY(180deg); }
      .flip-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
      .flip-back { transform: rotateY(180deg); }
      .card-face {
        display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 20px;
        border: 1px solid var(--line); background: linear-gradient(160deg, #142a49, #0e1d33);
        box-shadow: 0 18px 40px rgba(3, 10, 20, 0.45);
      }
      .card-back { background: linear-gradient(160deg, #123243, #0d2233); border-color: rgba(62, 207, 142, 0.4); }

      /* ------- toasty / modal ------- */
      #toasts { position: fixed; right: 16px; bottom: 16px; z-index: 100; display: flex; flex-direction: column; gap: 8px; }
      .toast {
        display: flex; align-items: center; gap: 9px; background: #0d1e36; border: 1px solid var(--line);
        padding: 10px 16px; border-radius: 12px; font-size: 13.5px; font-weight: 600;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45); animation: toastIn 0.3s cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }
      .toast.out { animation: toastOut 0.25s ease both; }
      #modal { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; padding: 16px; }
      #modal .veil { position: absolute; inset: 0; background: rgba(6, 15, 29, 0.75); animation: fadeIn 0.25s ease both; }
      #modal .mcard { position: relative; width: 100%; max-width: 26rem; padding: 24px; animation: popIn 0.3s cubic-bezier(0.2, 0.7, 0.2, 1) both; }

      /* ------- animacje ------- */
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes viewIn { from { opacity: 0; transform: translateY(12px); } }
      .animate-view { animation: viewIn 0.4s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
      @keyframes popIn { from { opacity: 0; transform: scale(0.94) translateY(8px); } }
      .animate-popIn { animation: popIn 0.35s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
      @keyframes fadeIn { from { opacity: 0; } }
      .animate-fadeIn { animation: fadeIn 0.3s ease both; }
      @keyframes toastIn { from { opacity: 0; transform: translateX(24px); } }
      @keyframes toastOut { to { opacity: 0; transform: translateX(24px); } }
      @keyframes fxGood { 0%, 55% { fill: #4caf78; } }
      @keyframes fxBad { 0%, 55% { fill: #e2685f; } }
      @keyframes pulseR { 50% { filter: brightness(1.5); } }
      @keyframes shake { 20%, 60% { transform: translateX(-4px); } 40%, 80% { transform: translateX(4px); } }

      .nice-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
      .nice-scroll::-webkit-scrollbar-thumb { background: #1e3554; border-radius: 8px; }
      .nice-scroll::-webkit-scrollbar-thumb:hover { background: #31517a; }
    </style>
  </head>
  <body>
    <div class="app">
      <!-- ================= SIDEBAR ================= -->
      <aside class="side nice-scroll">
        <div class="logo">
          <span class="logo-badge" data-icon="compass"></span>
          <div>
            <div class="logo-name">KOMPAS</div>
            <div class="logo-sub">Atlas Europy · klasa 6</div>
          </div>
        </div>
        <nav class="side-nav" id="sideNav"></nav>
        <div class="side-foot">
          <div class="panel" style="padding: 14px;">
            <div style="display:flex; justify-content:space-between; align-items:baseline; font-size:12px; margin-bottom:8px;">
              <span style="font-weight:700;">Opanowane</span>
              <span class="font-display" style="font-weight:800; color:var(--amber);" id="sideTxt">0/47</span>
            </div>
            <div style="height:10px; border-radius:999px; background:#122440; border:1px solid var(--line); overflow:hidden;">
              <div id="sideBar" style="height:100%; width:0%; border-radius:999px; background:linear-gradient(90deg,#c98f2c,#f6b94b); transition:width .7s;"></div>
            </div>
          </div>
          <div style="border-radius:12px; border:1px solid var(--line); background:rgba(11,27,48,.7); padding:14px;">
            <div class="lbl" style="margin-bottom:6px;">Wskazówka nawigatora</div>
            <p id="tip" style="font-size:12px; color:var(--mut); line-height:1.55; margin:0;"></p>
          </div>
        </div>
      </aside>

      <!-- ================= PASEK MOBILNY ================= -->
      <div class="m-top">
        <div class="logo">
          <span class="logo-badge" data-icon="compass"></span>
          <div>
            <div class="logo-name">KOMPAS</div>
            <div class="logo-sub">Atlas Europy · klasa 6</div>
          </div>
        </div>
        <nav class="m-nav nice-scroll" id="mNav"></nav>
      </div>

      <!-- ================= TREŚĆ ================= -->
      <div class="maincol">
        <header class="top">
          <div>
            <h1 id="hdrTitle">Mapa Europy</h1>
            <p class="sub" id="hdrSub"></p>
          </div>
          <div class="hdr-chips">
            <div class="hdr-chip">
              <svg width="34" height="34" style="transform:rotate(-90deg)">
                <circle cx="17" cy="17" r="13" stroke="#1e3554" stroke-width="4" fill="none"></circle>
                <circle id="hdrRingC" cx="17" cy="17" r="13" stroke="#f6b94b" stroke-width="4" fill="none"
                  stroke-linecap="round" stroke-dasharray="81.68" stroke-dashoffset="81.68"
                  style="transition:stroke-dashoffset .8s cubic-bezier(.2,.7,.2,1)"></circle>
              </svg>
              <div><b id="hdrLearned">0/47</b><small>opanowane</small></div>
            </div>
            <div class="hdr-chip streak">
              <span data-icon="flame" style="color:var(--amber); display:inline-flex;"></span>
              <div><b id="hdrStreak">0</b><small>rekord serii</small></div>
            </div>
          </div>
        </header>

        <main class="content">
          <!-- MAPA -->
          <section class="view hidden" id="view-mapa">
            <div id="ex-toolbar" style="margin-bottom:14px;"></div>
            <div class="mapwrap" id="mapwrap"></div>
            <div id="ex-panels" style="display:grid; gap:20px; margin-top:20px; align-items:start;"></div>
          </section>

          <!-- FISZKI -->
          <section class="view hidden" id="view-fiszki"></section>

          <!-- QUIZ -->
          <section class="view hidden" id="view-quiz"></section>

          <!-- QUIZ NA MAPIE -->
          <section class="view hidden" id="view-mapquiz">
            <div id="mq-hud" style="margin-bottom:14px;"></div>
          </section>

          <!-- POSTĘPY -->
          <section class="view hidden" id="view-postepy"></section>
        </main>
      </div>
    </div>

    <div id="toasts"></div>
    <div id="modal" class="hidden"></div>

    <script>
      "use strict";
      /* ============================================================
         KOMPAS — Atlas Europy · wersja jednoplikowa (vanilla JS)
         ============================================================ */

      /* ---------------- dane ---------------- */
      const COUNTRIES = [

      function esc(s) {

      }
      function flag(iso) {
        return iso.toUpperCase().replace(/./g, (ch) => String.fromCodePoint(127397 + ch.charCodeAt(0)));
      }
      function shuffle(a) {
        const r = [...a];
        for (let i = r.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [r[i], r[j]] = [r[j], r[i]];
        }
        return r;
      }

        const before = stat(id).learned;
        const s = Object.assign({}, stat(id));
        if (ok) { s.c += 1; if (s.c >= 3 && s.w < 2) s.learned = true; }
        else { s.w += 1; }
        store.learned[id] = s;
        save();
        return { learned: s.learned, newly: s.learned && !before };
      }

        const cx = (c0[0] + c1[0] + c2[0]) / 3;
        const cy = (c0[1] + c1[1] + c2[1]) / 3;
        return d3.geoMercator()
          .clipExtent([[0, 0], [W, H]])
          .scale((1 / Math.max(Math.abs(c1[0] - c2[0]), Math.abs(c0[1] - c2[1]))) * Math.min(W, H) * 0.99)
          .translate([W / 2 - cx, H / 2 - cy]);
      }

      function setMapStatus(text) {
        const el = document.getElementById("map-status");
        if (el) el.textContent = text;
      }

      function loadScript(url) {
        return new Promise((resolve, reject) => {
          const s = document.createElement("script");
          s.src = url;
          s.onload = () => resolve();
          s.onerror = () => { s.remove(); reject(new Error("script: " + url)); };
          document.head.appendChild(s);
        });
      }

      async function loadLibsWithFallback(urls, check) {
        if (check()) return;
        for (const u of urls) {
          try {
            await loadScript(u);
            if (check()) return;
          } catch (e) {}
        }
        throw new Error("libs");
      }

      async function fetchWithTimeout(url, ms) {
        const ctrl = "AbortController" in window ? new AbortController() : null;
        const t = ctrl ? setTimeout(() => ctrl.abort(), ms) : null;
        try {
          const r = await fetch(url, ctrl ? { signal: ctrl.signal } : undefined);
          if (!r.ok) throw new Error("http " + r.status);
          return await r.json();
        } finally {
          if (t) clearTimeout(t);
        }
      }

      function readMapCache() {
        try {
          const raw = localStorage.getItem(CACHE_KEY);
          if (!raw) return null;
          const obj = JSON.parse(raw);
          if (obj && obj.topo && obj.topo.objects && obj.topo.objects.countries) return obj.topo;
        } catch (e) {}
        return null;
      }

      function writeMapCache(topo) {
        try { localStorage.setItem(CACHE_KEY, JSON.stringify({ topo: topo })); } catch (e) {}
      }

      async function loadMap() {
        mapState = "loading";
        mapCached = false;
        renderMapWrap();
        setMapStatus("pobieram biblioteki mapy…");
        try {
          await loadLibsWithFallback(D3_URLS, () => !!(window.d3 && window.d3.geoPath));
          await loadLibsWithFallback(TOPOJSON_URLS, () => !!(window.topojson && window.topojson.feature));
        } catch (e) {
          mapState = "error";
          renderMapWrap();
          return;
        }

        setMapStatus("sprawdzam własną mapę z pliku…");
        const custom = readCustomMap() || customMemory;
        if (custom && custom.feats && custom.feats.length) {
          customMapActive = true;
          customMapName = custom.name || "użytkownika";
          setMapStatus("rysuję kontury z pliku " + customMapName + "…");
          buildMap(custom.feats);
          mapState = "ready";
          mapReady = true;
          renderMapWrap();
          if (view === "mapa") renderExplore();
          return;
        }
        customMapActive = false;
        customMapName = "";

        setMapStatus("szukam mapy w pamięci przeglądarki…");
        let topo = readMapCache();
        if (topo) {
          mapCached = true;
        } else {
          for (let i = 0; i < TOPO_URLS.length; i++) {
            setMapStatus("pobieram kontury państw… (źródło " + (i + 1) + "/" + TOPO_URLS.length + ")");
            try {
              const t = await fetchWithTimeout(TOPO_URLS[i], 9000);
              if (t && t.objects && t.objects.countries) { topo = t; break; }
            } catch (e) {}
          }
        }
        if (!topo) {
          mapState = "error";
          renderMapWrap();
          return;
        }
        if (!mapCached) writeMapCache(topo);

        setMapStatus("rysuję kontury…");
        const okey = topo.objects.countries ? "countries" : Object.keys(topo.objects)[0];
        buildMap(topojson.feature(topo, topo.objects[okey]).features);
        mapState = "ready";
        mapReady = true;
        renderMapWrap();
        if (view === "mapa") renderExplore();
      }

      /* -------- silnik przybliżania i etykiet (konstrukcja z pliku "Mapa Europy") -------- */
      const cArea = {};        // id -> powierzchnia konturu w px² (przy k = 1)
      const labelNodes = {};   // id -> <text> z nazwą państwa
      const capLabelNodes = {}; // id -> <text> z nazwą stolicy
      const zm = { k: 1, tx: 0, ty: 0 };
      let zoomG = null;
      let justDragged = false;

      function mainCentroid(f, path) {
        const g = f.geometry;
        if (!g) return null;
        let c = null;
        if (g.type === "Polygon") c = path.centroid(f);
        else if (g.type === "MultiPolygon") {
          let bestA = -1;
          g.coordinates.forEach((poly) => {
            const sub = { type: "Feature", properties: {}, geometry: { type: "Polygon", coordinates: poly } };
            const a = Math.abs(path.area(sub));
            if (a > bestA) { bestA = a; c = path.centroid(sub); }
          });
        }
        if (c && isFinite(c[0]) && isFinite(c[1]) && c[0] > -60 && c[0] < W + 60 && c[1] > -60 && c[1] < H + 60) return c;
        return null;
      }

      function applyZoom() {
        if (!zoomG || !mapSvg) return;
        zoomG.setAttribute("transform", "translate(" + zm.tx + "," + zm.ty + ") scale(" + zm.k + ")");
        mapSvg.style.setProperty("--k", String(zm.k));
        // w quizie na mapie etykiety byłyby podpowiedzią — wyłączamy je
        const inQuiz = view === "mapquiz" && mq.phase === "play";
        const k2 = zm.k * zm.k;
        for (const id in labelNodes) {
          const a = (cArea[id] || 0) * k2;
          const show = !inQuiz && (ex.showNames ? (a >= 550 || zm.k >= 1.9) : (a >= 1500 || zm.k >= 2.8));
          labelNodes[id].style.display = show ? "" : "none";
        }
        for (const id in capLabelNodes) {
          capLabelNodes[id].style.display = (!inQuiz && (ex.showCapNames || zm.k >= 2.4)) ? "" : "none";
        }
      }

      function clientToView(e) {
        const r = mapSvg.getBoundingClientRect();
        return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H];
      }

      function zoomAt(px, py, f) {
        const k2 = Math.max(1, Math.min(9, zm.k * f));
        if (k2 === zm.k) return;
        zm.tx = px - (px - zm.tx) * (k2 / zm.k);
        zm.ty = py - (py - zm.ty) * (k2 / zm.k);
        zm.k = k2;
        if (zm.k <= 1.001) { zm.k = 1; zm.tx = 0; zm.ty = 0; }
        applyZoom();
      }

      function bindZoomAndPan() {
        mapSvg.addEventListener("wheel", (e) => {
          e.preventDefault();
          const p = clientToView(e);
          zoomAt(p[0], p[1], e.deltaY < 0 ? 1.3 : 1 / 1.3);
        }, { passive: false });
        mapSvg.addEventListener("dblclick", (e) => {
          e.preventDefault();
          const p = clientToView(e);
          zoomAt(p[0], p[1], 1.7);
        });
        let pan = null;
        mapSvg.addEventListener("pointerdown", (e) => {
          if (e.pointerType === "mouse" && e.button !== 0) return;
          pan = { x: e.clientX, y: e.clientY, tx: zm.tx, ty: zm.ty, moved: false };
          try { mapSvg.setPointerCapture(e.pointerId); } catch (err) {}
          mapSvg.classList.add("dragging");
        });
        mapSvg.addEventListener("pointermove", (e) => {
          if (!pan) return;
          const r = mapSvg.getBoundingClientRect();
          if (Math.abs(e.clientX - pan.x) + Math.abs(e.clientY - pan.y) > 5) pan.moved = true;
          zm.tx = pan.tx + (e.clientX - pan.x) / r.width * W;
          zm.ty = pan.ty + (e.clientY - pan.y) / r.height * H;
          applyZoom();
        });
        const endPan = () => {
          if (!pan) return;
          justDragged = pan.moved;
          pan = null;
          mapSvg.classList.remove("dragging");
        };
        mapSvg.addEventListener("pointerup", endPan);
        mapSvg.addEventListener("pointercancel", endPan);
      }

      function buildMap(featsRaw) {
        const feats = featsRaw.map(normalizeFeature).filter((f) => f && f.geometry);
        const proj = makeProjection();
        const path = d3.geoPath(proj);

        mapSvg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, class: "map-svg", role: "img", "aria-label": "Mapa Europy" });
        mapSvg.style.background = "radial-gradient(900px 620px at 30% 16%, #e6f3fc, #d7edf9 64%)";

        svgEl("rect", { x: 0, y: 0, width: W, height: H, fill: "#d7edf9" }, mapSvg);

        zoomG = svgEl("g", { id: "zoomG" }, mapSvg);

        const grat = d3.geoGraticule10 ? d3.geoGraticule10() : d3.geoGraticule().step([10, 10])();
        svgEl("path", { d: path(grat), class: "graticule" }, zoomG);

        // kontekst (państwa spoza listy, np. fragmenty Afryki i Azji)
        const gCtx = svgEl("g", {}, zoomG);
        feats.forEach((f) => {
          if (INTERACTIVE.has(f.id)) return;
          const b = d3.geoBounds(f);
          if (b[0][0] > 50 || b[1][0] < -28 || b[0][1] > 73 || b[1][1] < 32) return;
          const d = path(f);
          if (d) svgEl("path", { d: d, class: "ctx" }, gCtx).style.pointerEvents = "none";
        });

        svgEl("rect", { x: 2.5, y: 2.5, width: W - 5, height: H - 5, fill: "none", rx: 12, class: "sea-outline" }, mapSvg);

        // państwa interaktywne
        const gEu = svgEl("g", {}, zoomG);
        feats.filter((f) => INTERACTIVE.has(f.id)).forEach((f) => {
          const d = path(f);
          if (!d) return;
          const p = svgEl("path", { d: d, "data-id": f.id, class: "eu eu-new" }, gEu);

          cArea[f.id] = Math.abs(path.area(f));

          if (c) capPos[f.id] = c;

        // kropki mikropaństw (za małe na kontur)

        // nazwy państw (widoczne zależnie od przybliżenia)

          labelNodes[c.id] = t;
        });

        // stolice: kropka + nazwa
        capsG = svgEl("g", {}, zoomG);
        COUNTRIES.forEach((c) => {
          const pos = capPos[c.id];
          if (!pos) return;
          const g = svgEl("g", { class: "cap", "data-id": c.id }, capsG);
          svgEl("circle", { cx: pos[0], cy: pos[1], r: 3.4, class: "capdot" }, g);
          svgEl("circle", { cx: pos[0], cy: pos[1], r: 10, class: "hit" }, g);
          const nearRight = pos[0] > W - 150;
          const t = svgEl("text", {
            x: pos[0] + (nearRight ? -7 : 7), y: pos[1] - 6,
            class: "cname", "text-anchor": nearRight ? "end" : "start"
          }, g);
          t.textContent = c.capital;
          capLabelNodes[c.id] = t;
        });

        // pierścień zaznaczenia (w grupie zoomu, żeby podążał za przybliżeniem)
        markRing = svgEl("circle", { r: 11, class: "mark-ring", style: "display:none" }, zoomG);
        markRing.style.pointerEvents = "none";

        // kompas
        const gc = svgEl("g", { transform: "translate(852,64)", opacity: 0.8 }, mapSvg);
        svgEl("circle", { r: 24, fill: "rgba(255,255,255,.75)", stroke: "#a7c9dd", "stroke-width": 1 }, gc);
        svgEl("circle", { r: 17, fill: "none", stroke: "#a7c9dd", "stroke-width": 0.6, "stroke-dasharray": "2 4" }, gc);
        const spin = svgEl("g", { class: "compass-spin" }, gc);

        svgEl("path", { d: "M0,-13 L4,0 L-4,0 Z", fill: "#1f2c36", opacity: 0.85 }, spin);
        const tx = svgEl("text", { y: -32, "text-anchor": "middle", fill: "#5c6b78", "font-size": 12, "font-weight": 800, "font-family": "Bricolage Grotesque, sans-serif" }, gc);
        tx.textContent = "N";

        // legenda

        const legBg = svgEl("rect", { x: -12, y: -22, width: 216, height: 92, rx: 12, fill: "rgba(255,255,255,.92)", stroke: "#d3dfe8" }, lg);
        legBg.style.pointerEvents = "none";

        legT.textContent = "TWÓJ POSTĘP";
        [["nowe", "#faf4e3", 14], ["w trakcie", "#ffe3ae", 36], ["opanowane", "#cdeed9", 58]].forEach((it) => {
          svgEl("rect", { x: 0, y: it[2], width: 12, height: 12, rx: 3, fill: it[1], stroke: "#c9c0ae", "stroke-width": 0.7 }, lg).style.pointerEvents = "none";

          t.textContent = it[0];
          t.style.pointerEvents = "none";
        });

        bindZoomAndPan();
        applyZoom();
        applyToggles();
        paintMap();
      }

        ["serbia", "688"], ["republic of serbia", "688"], ["croatia", "191"], ["slovenia", "705"],
        ["bosnia and herzegovina", "070"], ["bosnia and herz.", "070"], ["bosnia-herzegovina", "070"],
        ["albania", "008"], ["north macedonia", "807"], ["macedonia", "807"], ["montenegro", "499"],
        ["kosovo", "-99"], ["hungary", "348"], ["malta", "470"], ["cyprus", "196"], ["andorra", "020"],
        ["monaco", "492"], ["san marino", "674"], ["liechtenstein", "438"], ["vatican", "336"], ["holy see", "336"]
      ].forEach((kv) => { NAME_TO_ID[kv[0]] = kv[1]; });

      function normalizeFeature(f) {
        const p = (f.properties = f.properties || {});
        p.name = p.name || p.NAME || p.ADMIN || p.admin || p.NAME_PL || p.name_pl || p.PL_NAME || p.pl_name || p.NAME_LONG || "";
        let id = f.id != null && f.id !== "" ? String(f.id) : null;
        if (id && /^\d+$/.test(id)) id = id.padStart(3, "0");
        if (!id || !byId[id]) {
          const a2 = String(p.iso_a2 || p.ISO_A2 || p.ISO_A2_EH || p.ISO_A2_1 || "").toUpperCase();
          const a3 = String(p.iso_a3 || p.ISO_A3 || p.ADM0_A3 || p.adm0_a3 || p.GU_A3 || p.SOV_A3 || "").toLowerCase();
          if (a2 === "XK" || a2 === "KV") id = "-99";
          else if (ISO2_TO_ID[a2]) id = ISO2_TO_ID[a2];
          else if (a3 === "xkx" || a3 === "kvx") id = "-99";
          else if (ISO3_TO_ID[a3]) id = ISO3_TO_ID[a3];
        }
        if (!id || !byId[id]) {
          const nm = String(p.name).toLowerCase().trim();
          if (NAME_TO_ID[nm]) id = NAME_TO_ID[nm];
        }
        if (id) f.id = id;
        return f;
      }

      /* skaner nawiasów: wycina z tekstu pierwszy zbalansowany obiekt JSON od pozycji start */
      function scanBalanced(text, start) {
        if (text[start] !== "{" && text[start] !== "[") return null;
        let depth = 0, inStr = false, esc = false;
        for (let i = start; i < text.length; i++) {
          const ch = text[i];
          if (inStr) {
            if (esc) esc = false;
            else if (ch === "\\") esc = true;
            else if (ch === '"') inStr = false;
            continue;
          }
          if (ch === '"') inStr = true;
          else if (ch === "{" || ch === "[") depth++;
          else if (ch === "}" || ch === "]") {
            depth--;
            if (depth === 0) return text.slice(start, i + 1);
          }
        }
        return null;
      }

      /* szuka osadzonych w HTML-u danych GeoJSON / TopoJSON */
      function extractJsonFromText(text) {
        const starts = [];
        const markers = ['"FeatureCollection"', "'FeatureCollection'", '"Topology"', "'Topology'", '"features"', '"objects"'];
        for (const m of markers) {
          let idx = text.indexOf(m);
          while (idx !== -1 && starts.length < 60) {
            let s = idx;
            while (s > 0 && text[s] !== "{" && text[s] !== "[") s--;
            if (s !== starts[starts.length - 1]) starts.push(s);
            idx = text.indexOf(m, idx + m.length);
          }
        }
        for (const s of starts) {
          const slice = scanBalanced(text, s);
          if (!slice || slice.length < 300) continue;
          try {
            const obj = JSON.parse(slice);
            if (obj && (obj.type === "FeatureCollection" || obj.type === "Topology")) return obj;
          } catch (e) {}
        }
        return null;
      }

      function parseMapData(text) {
        const t = text.trim();
        let obj;
        if (t.charAt(0) === "<") {
          obj = extractJsonFromText(t);
          if (!obj) {
            throw new Error(
              "To plik HTML, ale nie znalazłem w nim osadzonych danych mapy (GeoJSON/TopoJSON). " +
              "Wklej jego zawartość w czacie — wyciągnę kontury ręcznie."
            );
          }
        } else {
          try { obj = JSON.parse(t); } catch (e) { throw new Error("Plik nie jest poprawnym JSON-em."); }
        }
        let feats, store;
        if (obj.type === "Topology" && obj.objects) {
          const key = obj.objects.countries ? "countries" : Object.keys(obj.objects)[0];
          feats = topojson.feature(obj, obj.objects[key]).features;
          store = { kind: "topo", topo: obj };
        } else if (obj.type === "FeatureCollection" && Array.isArray(obj.features)) {
          feats = obj.features;
          store = {
            kind: "feats",
            feats: feats
              .filter((f) => f && f.geometry)
              .map((f) => ({
                type: "Feature",
                id: f.id != null ? f.id : null,
                properties: {
                  name: (f.properties && (f.properties.name || f.properties.NAME || f.properties.ADMIN)) || "",
                  iso_a2: (f.properties && (f.properties.iso_a2 || f.properties.ISO_A2)) || "",
                  iso_a3: (f.properties && (f.properties.iso_a3 || f.properties.ISO_A3 || f.properties.ADM0_A3)) || ""
                },
                geometry: f.geometry
              }))
          };
        } else if (obj.type === "Feature") {
          feats = [obj];
          store = { kind: "feats", feats: [obj] };
        } else {
          throw new Error("Nie rozpoznaję struktury pliku. Oczekuję TopoJSON lub GeoJSON (FeatureCollection).");
        }
        feats = feats.map(normalizeFeature).filter((f) => f && f.geometry);
        if (!feats.length) throw new Error("W pliku nie znalazłem żadnych geometrii państw.");
        const known = feats.filter((f) => byId[f.id]).length;
        return { feats: feats, count: feats.length, known: known, store: store };
      }

      function readCustomMap() {
        try {
          const raw = localStorage.getItem(CUSTOM_KEY);
          if (!raw) return null;
          const obj = JSON.parse(raw);
          if (!obj) return null;
          if (obj.kind === "topo" && obj.topo && obj.topo.objects) {
            const key = obj.topo.objects.countries ? "countries" : Object.keys(obj.topo.objects)[0];
            return { feats: topojson.feature(obj.topo, obj.topo.objects[key]).features, name: obj.name || "" };
          }
          if (obj.kind === "feats" && Array.isArray(obj.feats)) return { feats: obj.feats, name: obj.name || "" };
        } catch (e) {}
        return null;
      }

      /* wyciąga z kodu HTML adresy, spod których plik ładuje dane mapy */
      function extractDataUrls(text) {
        const found = [];
        const seen = {};
        const push = (u) => {
          if (u && !seen[u] && found.length < 12) { seen[u] = 1; found.push(u); }
        };
        let m;
        const reJson = /["'](https?:\/\/[^"']+?\.(?:geo|topo)?json[^"']*)["']/gi;
        while ((m = reJson.exec(text))) push(m[1]);
        const reFetch = /(?:fetch|open|get|load)\s*\(\s*["'](https?:\/\/[^"']+)["']/gi;
        while ((m = reFetch.exec(text))) push(m[1]);
        const reSrc = /(?:src|href|url)\s*[:=]\s*["'](https?:\/\/[^"']+\.(?:geo|topo)?json[^"']*)["']/gi;
        while ((m = reSrc.exec(text))) push(m[1]);
        return found;
      }

      function showMapDiagnostics(fileName, text) {
        const scripts = (text.match(/<script[\s>]/gi) || []).length;
        const hasLeaflet = /leaflet/i.test(text);
        const hasD3 = /\bd3\b|geoMercator|geoPath/i.test(text);
        const svgPaths = (text.match(/<path[\s>]/gi) || []).length;
        const urls = extractDataUrls(text);
        let rows = "";
        const row = (label, val, color) => {
          rows +=

        row("Biblioteka D3", hasD3 ? "wykryta" : "brak", hasD3 ? "#3ecf8e" : "#647d9e");
        row("Ścieżki SVG", String(svgPaths), svgPaths ? "#e9f2fb" : "#647d9e");
        row("Adresy danych (.json)", String(urls.length), urls.length ? "#f6b94b" : "#647d9e");

          ? '<div style="margin-top:10px; padding:0 0 8px; font-size:12px; word-break:break-all; color:#94aac6;">' +
            urls.slice(0, 5).map((u) => "• " + esc(u)).join("<br>") + "</div>"
          : "";
        const advice =
          svgPaths > 20 && !hasLeaflet && !hasD3
            ? "Wygląda na mapę narysowaną czystym SVG. Taką konstrukcję przenoszę ręcznie — <b style=\"color:var(--amber);\">wklej zawartość pliku w czacie</b>, a wbuduję ją w dashboard na stałe."
            : "Upewnij się, że ten plik otwarty samodzielnie w przeglądarce pokazuje mapę. Jeśli tak — <b style=\"color:var(--amber);\">wklej jego zawartość w czacie</b>: wyciągnę dane i osadzę je bezpośrednio w dashboardzie, żeby działał bez internetu.";
        showInfoModal(
          "Analiza pliku: " + esc(fileName),
          '<p style="margin:0 0 12px;">Nie znalazłem w środku osadzonych danych mapy, a zewnętrzne źródła nie odpowiedziały. Co wykryłem:</p>' +
          '<div style="border:1px solid var(--line); border-radius:12px; padding:4px 14px; background:#0b1b30;">' + rows + urlList + "</div>" +
          '<p style="margin:12px 0 0;">' + advice + "</p>"
        );
      }

      async function handleMapFile(file) {
        toast("Wczytuję " + file.name + "…", "info");
        let text = null;
        try {
          if (file.text) text = await file.text();
          else text = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result)); r.onerror = rej; r.readAsText(file); });
        } catch (e) { toast("Nie udało się odczytać pliku.", "warn"); return; }
        let parsed = null;
        const isHtml = text.trim().charAt(0) === "<";
        if (isHtml) {
          try { parsed = parseMapData(text); } catch (e) { parsed = null; }
          if (!parsed) {
            const urls = extractDataUrls(text);
            for (const u of urls.slice(0, 4)) {
              toast("Plik wskazuje zewnętrzne dane — pobieram…", "info");
              try {
                const data = await fetchWithTimeout(u, 9000);
                parsed = parseMapData(JSON.stringify(data));
                if (parsed) break;
              } catch (e) {}
            }
          }
          if (!parsed) { showMapDiagnostics(file.name, text); return; }
        } else {
          try { parsed = parseMapData(text); } catch (err) { toast(err.message, "warn"); return; }
        }
        parsed.store.name = file.name;
        let persisted = true;
        try { localStorage.setItem(CUSTOM_KEY, JSON.stringify(parsed.store)); }
        catch (e) { persisted = false; customMemory = { feats: parsed.feats, name: file.name }; }
        await loadMap();
        toast(
          "Wczytano " + parsed.count + " państw z pliku " + file.name +
          " (rozpoznanych na liście: " + parsed.known + ")" + (persisted ? " — mapa zapamiętana" : " — tylko na tę sesję"),
          "ok"
        );
      }

      /* -------- zdarzenia mapy (delegacja) -------- */
      function mapWrapAt(e) {
        return e.target && e.target.closest ? e.target.closest("[data-id]") : null;
      }
      document.addEventListener("pointerover", (e) => {
        if (!mapTip || mapState !== "ready") return;
        const wrap = $("#mapwrap");
        if (!wrap.contains(e.target)) return;
        const t = mapWrapAt(e);
        if (!t) return;
        const id = t.dataset.id;
        const c = byId[id];
        if (!c) return;
        if (view === "mapquiz" || (view === "mapa" && !ex.tooltips)) return;
        mapTip.innerHTML =
          '<div style="display:flex; align-items:center; gap:7px; font-weight:800; font-size:13.5px;">' +
          "<span>" + flag(c.iso2) + "</span>" + esc(c.name) + "</div>" +
          '<div style="font-size:12px; color:#94aac6; margin-top:3px;">stolica: <b style="color:#f6b94b;">' + esc(c.capital) + "</b></div>";
        mapTip.classList.remove("hidden");
      });
      document.addEventListener("pointermove", (e) => {
        if (!mapTip || mapTip.classList.contains("hidden")) return;
        const wrap = $("#mapwrap");
        const r = wrap.getBoundingClientRect();
        const x = e.clientX - r.left, y = e.clientY - r.top;
        mapTip.style.left = Math.min(Math.max(8, x + 14), r.width - 240) + "px";
        mapTip.style.top = Math.min(Math.max(8, y + 14), r.height - 70) + "px";
      });
      document.addEventListener("pointerout", (e) => {
        if (!mapTip) return;
        const t = mapWrapAt(e);
        if (t && (!e.relatedTarget || !t.contains(e.relatedTarget))) mapTip.classList.add("hidden");
        if (!t) mapTip.classList.add("hidden");
      });
