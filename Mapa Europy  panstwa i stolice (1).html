<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interaktywna mapa Europy — państwa i stolice</title>
<style>
:root{
  --sea:#d7edf9; --land:#faf4e3; --border:#83796a; --land-bg:#dcd5c6; --ink:#1f2c36; --muted:#5c6b78;
  --panel:#ffffff; --page:#eef4f8; --line:#d3dfe8; --accent:#2f7fb5;
  --sel:#ffb454; --ok:#4caf78; --bad:#e2685f;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--page); color:var(--ink); overflow:hidden;
}
#app{display:flex;flex-direction:column;height:100%}

header{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);
}
h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px}
h1 span{color:var(--accent)}
.tabs{display:flex;background:#e9f0f5;border-radius:999px;padding:3px;gap:2px}
.tabs button{
  border:0;background:transparent;padding:6px 16px;border-radius:999px;
  font:inherit;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;
}
.tabs button.on{background:var(--accent);color:#fff}
.toggles{display:flex;gap:14px;flex-wrap:wrap;margin-left:auto;font-size:13px;color:var(--muted)}
.toggles label{display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
.toggles input{accent-color:var(--accent);width:15px;height:15px}

main{flex:1;display:flex;min-height:0}
#mapWrap{flex:1;position:relative;min-width:0;background:var(--sea)}
svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
svg.dragging{cursor:grabbing}

#zoom{--k:1}
.country{
  fill:var(--land); stroke:var(--border); stroke-width:calc(1.15 / var(--k) * 1px);
  stroke-linejoin:round; cursor:pointer; transition:fill .12s;
}
.country:hover{fill:#ffd48c}
.country.sel{fill:var(--sel)}
.country.ok{fill:var(--ok)}
.country.bad{fill:var(--bad)}
.country.reveal{fill:#ffd166}
#bgland{fill:var(--land-bg);stroke:#c2bbac;stroke-width:calc(0.7 / var(--k) * 1px);pointer-events:none}
.hit{fill:transparent;cursor:pointer}
.hit.mk{fill:rgba(255,160,40,.55);stroke:#d97706;stroke-width:calc(2.2 / var(--k) * 1px)}
.hit.mkok{fill:rgba(76,175,120,.6);stroke:#2e8b57;stroke-width:calc(2.2 / var(--k) * 1px)}
.hit.mkbad{fill:rgba(226,104,95,.6);stroke:#c0463c;stroke-width:calc(2.2 / var(--k) * 1px)}
.cap{fill:#b2262f;stroke:#fff;stroke-width:calc(0.9 / var(--k) * 1px);cursor:pointer}
.cap:hover{fill:#ff5a45}
.cap.sel{fill:#ff8c1a;stroke:#7a3b00}
.cap.ok{fill:var(--ok)}
.cap.bad{fill:var(--bad)}
.lead{stroke:#b2262f;stroke-width:calc(1 / var(--k) * 1px);pointer-events:none}
.caps-off .cap,.caps-off .lead{display:none}
text{
  pointer-events:none; font-weight:600; fill:#1f2c36;
  paint-order:stroke; stroke:#fff; stroke-width:calc(3 / var(--k) * 1px);
  stroke-linejoin:round; text-anchor:middle;
}
.lbl{font-size:calc(11.5 / var(--k) * 1px)}
.clbl{font-size:calc(9.5 / var(--k) * 1px);fill:#8a1b23;stroke-width:calc(2.6 / var(--k) * 1px)}
.hidden{display:none}

#tip{
  position:absolute;pointer-events:none;background:rgba(31,44,54,.94);color:#fff;
  padding:5px 9px;border-radius:7px;font-size:13px;white-space:nowrap;
  transform:translate(-50%,-140%);opacity:0;transition:opacity .1s;z-index:5;
}
#zoomBtns{position:absolute;left:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;z-index:4}
#zoomBtns button{
  width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:#fff;
  font-size:18px;font-weight:700;color:var(--ink);cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.12);
}
#zoomBtns button:hover{background:#f0f6fa}
#hintBar{
  position:absolute;left:50%;transform:translateX(-50%);bottom:12px;z-index:4;
  background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:999px;
  padding:6px 16px;font-size:13px;color:var(--muted);box-shadow:0 1px 4px rgba(0,0,0,.08);
}

aside{
  width:340px;flex:none;background:var(--panel);border-left:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;
}
.card{padding:14px 16px;border-bottom:1px solid var(--line)}
#infoName{font-size:22px;font-weight:800;margin:0 0 2px}
#infoCap{font-size:15px;color:var(--accent);font-weight:700;margin:0 0 8px}
#infoFact{font-size:14px;line-height:1.5;color:#3d4c58;margin:0}
#infoEmpty{font-size:14px;color:var(--muted);line-height:1.55}
#search{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;
  font:inherit;font-size:14px;outline:none;
}
#search:focus{border-color:var(--accent)}
#listWrap{flex:1;overflow:auto;padding:6px 8px 20px}
.row{
  display:flex;justify-content:space-between;gap:8px;align-items:baseline;
  padding:7px 10px;border-radius:8px;cursor:pointer;font-size:14px;
}
.row:hover{background:#eef5fa}
.row.sel{background:#dcebf6}
.row b{font-weight:600}
.row i{font-style:normal;color:var(--muted);font-size:12.5px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;padding:10px 16px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.legend span{display:flex;align-items:center;gap:5px}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.15)}

/* QUIZ */
#quizBox{padding:16px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.qhead{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:600}
.bar{height:7px;background:#e9f0f5;border-radius:99px;overflow:hidden}
.bar div{height:100%;background:var(--accent);width:0;transition:width .25s}
#qText{font-size:18px;font-weight:700;line-height:1.35;margin:4px 0}
#qSub{font-size:13px;color:var(--muted);margin:-6px 0 0}
.opts{display:flex;flex-direction:column;gap:8px}
.opts button{
  text-align:left;padding:11px 13px;border-radius:10px;border:1.5px solid var(--line);
  background:#fff;font:inherit;font-size:15px;cursor:pointer;
}
.opts button:hover:not(:disabled){border-color:var(--accent);background:#f2f8fc}
.opts button.ok{background:#e4f6ec;border-color:var(--ok);font-weight:700}
.opts button.bad{background:#fdeceb;border-color:var(--bad)}
.opts button:disabled{cursor:default}
#feedback{font-size:14.5px;font-weight:700;min-height:22px}
#feedback.ok{color:#2e8b57}
#feedback.bad{color:#c0463c}
.btn{
  padding:11px 16px;border-radius:10px;border:0;background:var(--accent);color:#fff;
  font:inherit;font-size:15px;font-weight:700;cursor:pointer;
}
.btn:hover{background:#26689a}
.btn.ghost{background:#e9f0f5;color:var(--ink)}
.btn.ghost:hover{background:#dbe6ee}
.setup{display:flex;flex-direction:column;gap:10px}
.setup label{font-size:13px;font-weight:700;color:var(--muted)}
.setup select{width:100%;padding:9px;border:1px solid var(--line);border-radius:9px;font:inherit;font-size:14px}
#result{font-size:15px;line-height:1.6}
#result h2{margin:0 0 6px;font-size:26px}
#result ul{margin:8px 0 0;padding-left:18px}
#result li{margin-bottom:4px;font-size:13.5px}

@media (max-width:820px){
  #hintBar{font-size:11.5px;padding:5px 12px;bottom:8px;max-width:62%;line-height:1.3}
  #zoomBtns button{width:32px;height:32px}
  main{flex-direction:column}
  aside{width:auto;border-left:0;border-top:1px solid var(--line);max-height:46%}
  #mapWrap{flex:1 1 54%}
  .toggles{width:100%;margin-left:0}
  h1{font-size:15px}
}

</style>
</head>
<body>
<div id="app">
<header>
  <h1>Mapa Europy <span>— państwa i stolice</span></h1>
  <div class="tabs">
    <button id="tabLearn" class="on">Nauka</button>
    <button id="tabQuiz">Quiz</button>
  </div>
  <div class="toggles">
    <label><input type="checkbox" id="tName"> nazwy państw</label>
    <label><input type="checkbox" id="tCapDot" checked> kropki stolic</label>
    <label><input type="checkbox" id="tCapName"> nazwy stolic</label>
  </div>
</header>
<main>
  <div id="mapWrap">
    <svg id="map"></svg>
    <div id="tip"></div>
    <div id="zoomBtns">
      <button id="zIn" title="Przybliż">+</button>
      <button id="zOut" title="Oddal">−</button>
      <button id="zRes" title="Cała Europa" style="font-size:14px">⤢</button>
    </div>
    <div id="hintBar">Kliknij państwo lub czerwoną kropkę stolicy. Kółkiem myszy przybliżasz mapę — wtedy pojawiają się też nazwy małych państw.</div>
  </div>
  <aside>
    <div id="learnPane" style="display:flex;flex-direction:column;min-height:0;flex:1">
      <div class="card" id="info">
        <p id="infoEmpty">Kliknij dowolne państwo na mapie albo wybierz je z listy poniżej, a pokażę jego nazwę, stolicę i ciekawostkę.</p>
        <div id="infoFull" class="hidden">
          <p id="infoName"></p>
          <p id="infoCap"></p>
          <p id="infoFact"></p>
        </div>
      </div>
      <div style="padding:10px 12px 6px"><input id="search" placeholder="Szukaj państwa lub stolicy…"></div>
      <div id="listWrap"></div>
    </div>
    <div id="quizPane" class="hidden" style="flex:1;min-height:0;display:flex;flex-direction:column">
      <div id="quizBox"></div>
    </div>
  </aside>
</main>
</div>

const SVGNS='http://www.w3.org/2000/svg';
const el=(n,a={})=>{const e=document.createElementNS(SVGNS,n);for(const k in a)e.setAttribute(k,a[k]);return e;};
const $ = s=>document.querySelector(s);

const byCode = {};
GEO.countries.forEach(c=>byCode[c.code]=c);
const codes = GEO.countries.map(c=>c.code).filter(c=>DATA[c]);
const nameOf = c=>DATA[c][0], capOf = c=>DATA[c][1], grpOf = c=>DATA[c][2],
      euOf = c=>DATA[c][3], factOf = c=>DATA[c][4];
const collator = new Intl.Collator('pl');
const sorted = codes.slice().sort((a,b)=>collator.compare(nameOf(a),nameOf(b)));

/* ---------- budowa mapy ---------- */
const svg=$('#map');
svg.setAttribute('viewBox',`0 0 ${GEO.W} ${GEO.H}`);
svg.setAttribute('preserveAspectRatio','xMidYMid meet');
const zg=el('g',{id:'zoom'});
svg.appendChild(zg);
zg.appendChild(el('path',{id:'bgland',d:GEO.bg}));

/* ręczne korekty położenia podpisów (px w układzie mapy) */
const LABELOFF = {"HR":[-10,-8],"BA":[-4,6],"MK":[24,-6],"AL":[-16,12],"RS":[10,2],"SI":[-14,-4],
 "ME":[-16,4],"XK":[12,4],"DK":[-10,-6],"NL":[6,-10],"BE":[-10,6],"CY":[0,-10],
 "MT":[0,-16],"LU":[-18,0],"PT":[8,0],"CH":[-6,6],"AT":[6,4],"SK":[6,-4],"LI":[0,-8],
 "AM":[-6,10],"GE":[-8,-6],"AD":[0,-10],"MC":[0,-10],"SM":[0,-10],"VA":[-12,8]}
;
function splitName(n){
  if(n.length<=11 || !n.includes(' ')) return [n];
  const mid=n.length/2; let best=-1,bd=1e9;
  for(let i=0;i<n.length;i++) if(n[i]===' '){const d=Math.abs(i-mid); if(d<bd){bd=d;best=i;}}
  return best<0?[n]:[n.slice(0,best),n.slice(best+1)];
}
function setLabel(t,name){
  const x=t.getAttribute('x');
  const parts=splitName(name);
  t.textContent='';
  parts.forEach((p,i)=>{
    const ts=el('tspan',{x, dy: i===0 ? (parts.length>1?'-0.20em':'0.34em') : '1.05em'});
    ts.textContent=p; t.appendChild(ts);
  });
}

/* Watykan leży w środku Rzymu - przesuwamy jego znacznik z odnośnikiem */
const CAPOFF = {VA:[-15,11]};
const gC=el('g'), gHit=el('g'), gLead=el('g'), gCap=el('g'), gLbl=el('g'), gCLbl=el('g');
zg.append(gC,gHit,gLead,gCap,gLbl,gCLbl);

const pathOf={}, hitOf={}, dotOf={}, labOf={}, clabOf={};
GEO.countries.forEach(c=>{
  if(!DATA[c.code]) return;
  const p=el('path',{d:c.d,class:'country','data-c':c.code});
  gC.appendChild(p); pathOf[c.code]=p;
  if(c.area<160){
    const cc=GEO.caps[c.code], o=CAPOFF[c.code]||[0,0];
    const h=el('circle',{cx:cc[0]+o[0],cy:cc[1]+o[1],r:9,class:'hit','data-c':c.code});
    gHit.appendChild(h); hitOf[c.code]=h;
  }
  const cap0=GEO.caps[c.code], co=CAPOFF[c.code];
  const cap=co?[cap0[0]+co[0],cap0[1]+co[1]]:cap0;
  if(co) gLead.appendChild(el('line',{x1:cap0[0],y1:cap0[1],x2:cap[0],y2:cap[1],class:'lead'}));
  const d=el('circle',{cx:cap[0],cy:cap[1],r:3.4,class:'cap','data-cap':c.code});
  gCap.appendChild(d); dotOf[c.code]=d;

  const off=LABELOFF[c.code]||[0,0];
  const t=el('text',{x:c.cx+off[0],y:c.cy+off[1],class:'lbl hidden'});
  setLabel(t,nameOf(c.code)); gLbl.appendChild(t); labOf[c.code]=t;

  const ct=el('text',{x:cap[0],y:cap[1]-6.5,class:'clbl hidden'});
  ct.textContent=capOf(c.code); gCLbl.appendChild(ct); clabOf[c.code]=ct;
});

/* ---------- zoom / pan ---------- */
let k=1,tx=0,ty=0;
function clamp(){
  k=Math.max(1,Math.min(16,k));
  const minX=GEO.W-GEO.W*k, minY=GEO.H-GEO.H*k;
  tx=Math.max(minX,Math.min(0,tx)); ty=Math.max(minY,Math.min(0,ty));
}
function apply(){
  clamp();
  zg.setAttribute('transform',`translate(${tx},${ty}) scale(${k})`);
  zg.style.setProperty('--k',k);
  const r=(3.4/Math.pow(k,.75)).toFixed(2);
  for(const c in dotOf) dotOf[c].setAttribute('r',r);
  for(const c in hitOf) hitOf[c].setAttribute('r',(9/k).toFixed(2));
  refreshLabels();
}
function zoomAt(px,py,f){
  const nk=Math.max(1,Math.min(16,k*f));
  tx = px-(px-tx)*(nk/k); ty = py-(py-ty)*(nk/k); k=nk; apply();
}
function svgPt(ev){
  const r=svg.getBoundingClientRect();
  const sc=Math.min(r.width/GEO.W,r.height/GEO.H);
  const ox=(r.width-GEO.W*sc)/2, oy=(r.height-GEO.H*sc)/2;
  return [(ev.clientX-r.left-ox)/sc,(ev.clientY-r.top-oy)/sc];
}
svg.addEventListener('wheel',e=>{e.preventDefault();const[x,y]=svgPt(e);zoomAt(x,y,e.deltaY<0?1.22:1/1.22);},{passive:false});
$('#zIn').onclick=()=>zoomAt(GEO.W/2,GEO.H/2,1.5);
$('#zOut').onclick=()=>zoomAt(GEO.W/2,GEO.H/2,1/1.5);
$('#zRes').onclick=()=>{k=1;tx=0;ty=0;apply();};

let drag=null,moved=0,pinch=null;
const ptrs=new Map();
const scaleNow=()=>{const r=svg.getBoundingClientRect();return Math.min(r.width/GEO.W,r.height/GEO.H);};
function startPinch(){
  const [a,b]=[...ptrs.values()];
  pinch={d:Math.hypot(a.x-b.x,a.y-b.y),m:[(a.x+b.x)/2,(a.y+b.y)/2]};
}
svg.addEventListener('pointerdown',e=>{
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){drag={x:e.clientX,y:e.clientY};moved=0;svg.classList.add('dragging');}
  else {drag=null;startPinch();}
});
window.addEventListener('pointermove',e=>{
  if(ptrs.has(e.pointerId)) ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size>=2 && pinch){
    const [a,b]=[...ptrs.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y), m=[(a.x+b.x)/2,(a.y+b.y)/2];
    const sc=scaleNow(), r=svg.getBoundingClientRect();
    const ox=(r.width-GEO.W*sc)/2, oy=(r.height-GEO.H*sc)/2;
    const px=(pinch.m[0]-r.left-ox)/sc, py=(pinch.m[1]-r.top-oy)/sc;
    const f = (pinch.d>4 && d>4) ? d/pinch.d : 1;
    tx+=(m[0]-pinch.m[0])/sc; ty+=(m[1]-pinch.m[1])/sc;
    moved+=20; pinch={d,m};
    zoomAt(px,py,f);
    return;
  }
  if(drag){
    const sc=scaleNow();
    tx+=(e.clientX-drag.x)/sc; ty+=(e.clientY-drag.y)/sc;
    moved+=Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y);
    drag={x:e.clientX,y:e.clientY}; apply();
  }
});
svg.addEventListener('pointermove',hover);
window.addEventListener('pointerup',e=>{
  ptrs.delete(e.pointerId);
  if(ptrs.size<2) pinch=null;
  if(ptrs.size===0){drag=null;svg.classList.remove('dragging');}
});
window.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(!ptrs.size)drag=null;});
svg.addEventListener('dblclick',e=>{const[x,y]=svgPt(e);zoomAt(x,y,1.9);});
svg.addEventListener('pointerleave',()=>hideTip());

function zoomTo(code,pad=90){
  const b=byCode[code].b;
  const w=Math.max(b[2]-b[0],14), h=Math.max(b[3]-b[1],14);
  const nk=Math.max(1,Math.min(6,Math.min(GEO.W/(w+pad),GEO.H/(h+pad))));
  const cx=(b[0]+b[2])/2, cy=(b[1]+b[3])/2;
  k=nk; tx=GEO.W/2-cx*k; ty=GEO.H/2-cy*k; apply();
}

/* ---------- etykiety ---------- */
function refreshLabels(){
  const showN=$('#tName').checked, showC=$('#tCapName').checked && $('#tCapDot').checked;
  for(const c of codes){
    const vis = byCode[c].area*k*k > 1400 || (hitOf[c] && k > 2.4);
    labOf[c].classList.toggle('hidden', !(showN && vis) && !(selected===c && mode==='learn'));
    clabOf[c].classList.toggle('hidden', !(showC && vis) || capOf(c)===nameOf(c));
  }
}
$('#tName').onchange=refreshLabels;
$('#tCapName').onchange=refreshLabels;
$('#tCapDot').onchange=()=>{svg.classList.toggle('caps-off',!$('#tCapDot').checked);refreshLabels();};

/* ---------- tooltip ---------- */
const tip=$('#tip');
function showTip(txt,ev){
  tip.textContent=txt; tip.style.opacity=1;
  const r=svg.getBoundingClientRect();
  tip.style.left=(ev.clientX-r.left)+'px'; tip.style.top=(ev.clientY-r.top)+'px';
}
function hideTip(){tip.style.opacity=0;}
function hover(ev){
  if(mode==='quiz'){hideTip();return;}
  const t=ev.target;
  if(t.dataset && t.dataset.cap) showTip('★ '+capOf(t.dataset.cap)+' — stolica: '+nameOf(t.dataset.cap),ev);
  else if(t.dataset && t.dataset.c) showTip(nameOf(t.dataset.c),ev);
  else hideTip();
}

/* ---------- wybór ---------- */
let selected=null, mode='learn';
function clearMarks(){
  for(const c of codes){
    pathOf[c].classList.remove('sel','ok','bad','reveal');
    dotOf[c].classList.remove('sel','ok','bad');
    if(hitOf[c]) hitOf[c].classList.remove('mk','mkok','mkbad');
  }
}
function markCountry(code,cls){
  pathOf[code].classList.add(cls);
  if(hitOf[code]) hitOf[code].classList.add(cls==='ok'?'mkok':cls==='bad'?'mkbad':'mk');
}
function select(code,fromList){
  selected=code; clearMarks();
  markCountry(code,'sel');
  $('#infoEmpty').classList.add('hidden');
  $('#infoFull').classList.remove('hidden');
  $('#infoName').textContent=nameOf(code)+(euOf(code)?' 🇪🇺':'');
  $('#infoCap').textContent='Stolica: '+capOf(code);
  $('#infoFact').textContent=factOf(code);
  document.querySelectorAll('.row').forEach(r=>r.classList.toggle('sel',r.dataset.c===code));
  if(fromList){const r=document.querySelector('.row[data-c="'+code+'"]');if(r)r.scrollIntoView({block:'nearest'});}
  refreshLabels();
}
function selectCapital(code){
  select(code); dotOf[code].classList.add('sel');
  $('#infoCap').textContent='Stolica: '+capOf(code)+' ★';
}

svg.addEventListener('click',e=>{
  if(moved>6) return;
  const t=e.target;
  const capC=t.dataset&&t.dataset.cap, cC=t.dataset&&t.dataset.c;
  if(mode==='quiz'){ quizMapClick(capC,cC); return; }
  if(capC) selectCapital(capC);
  else if(cC) select(cC);
});

/* ---------- lista i legenda ---------- */
const listWrap=$('#listWrap');
function buildList(filter=''){
  listWrap.innerHTML='';
  const f=filter.trim().toLowerCase();
  let n=0;
  for(const c of sorted){
    if(f && !(nameOf(c).toLowerCase().includes(f)||capOf(c).toLowerCase().includes(f))) continue;
    const d=document.createElement('div');
    d.className='row'+(selected===c?' sel':''); d.dataset.c=c;
    d.innerHTML='<b></b><i></i>';
    d.children[0].textContent=nameOf(c); d.children[1].textContent=capOf(c);
    d.onclick=()=>{select(c,true);zoomTo(c);};
    listWrap.appendChild(d); n++;
  }
  if(!n) listWrap.innerHTML='<p style="padding:12px;color:#5c6b78;font-size:14px">Nic nie znaleziono.</p>';
}
buildList();
$('#search').oninput=e=>buildList(e.target.value);

/* ---------- tryby ---------- */
$('#tabLearn').onclick=()=>setMode('learn');
$('#tabQuiz').onclick=()=>setMode('quiz');
function setMode(m){
  mode=m; clearMarks(); selected=null; hideTip();
  $('#tabLearn').classList.toggle('on',m==='learn');
  $('#tabQuiz').classList.toggle('on',m==='quiz');
  $('#learnPane').style.display = m==='learn'?'flex':'none';
  $('#quizPane').classList.toggle('hidden',m!=='quiz');
  $('#hintBar').style.display = m==='learn'?'':'none';
  if(m==='quiz'){ $('#tName').checked=false; $('#tCapName').checked=false; quizSetup(); }
  refreshLabels();
}

/* ---------- QUIZ ---------- */
const qBox=$('#quizBox');
let Q=null, awaiting=null;
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function quizSetup(){
  clearMarks();
  qBox.innerHTML=`
  <div class="setup">
    <h2 style="margin:0;font-size:20px">Sprawdź się!</h2>
    <p style="margin:0;font-size:14px;color:#5c6b78;line-height:1.5">
      Odpowiadaj klikając na mapie albo wybierając odpowiedź z listy.</p>
    <label>Zakres pytań</label>
    <select id="qScope">
      <option value="easy">Łatwiejszy — 25 większych państw</option>
      <option value="eu">Unia Europejska (27 państw)</option>
      <option value="all">Cała Europa (50 państw)</option>
    </select>
    <label>Rodzaj pytań</label>
    <select id="qKind">
      <option value="mix">Wszystkie wymieszane</option>
      <option value="pointCountry">Wskaż państwo na mapie</option>
      <option value="pointCapital">Wskaż stolicę na mapie</option>
      <option value="nameCountry">Rozpoznaj państwo</option>
      <option value="nameCapital">Podaj stolicę</option>
    </select>
    <label>Liczba pytań</label>
    <select id="qLen"><option>10</option><option>15</option><option>20</option></select>
    <button class="btn" id="qStart" style="margin-top:6px">Zaczynamy!</button>
  </div>`;
  $('#qStart').onclick=()=>{
    const scope=$('#qScope').value;
    let pool = scope==='eu' ? codes.filter(euOf)
             : scope==='easy' ? codes.slice().sort((a,b)=>byCode[b].area-byCode[a].area).slice(0,25)
             : codes.slice();
    const kind=$('#qKind').value, n=+$('#qLen').value;
    Q={pool,kind,n,i:0,score:0,wrong:[]};
    nextQ();
  };
}

function makeQ(){
  const kinds=['pointCountry','pointCapital','nameCountry','nameCapital'];
  const kind = Q.kind==='mix' ? rnd(kinds) : Q.kind;
  const code = rnd(Q.pool);
  let opts=null;
  if(kind==='nameCountry'||kind==='nameCapital'){
    const same=Q.pool.filter(c=>c!==code&&grpOf(c)===grpOf(code));
    const other=Q.pool.filter(c=>c!==code&&grpOf(c)!==grpOf(code));
    const dist=shuffle(same).slice(0,2).concat(shuffle(other).slice(0,3)).slice(0,3);
    while(dist.length<3){const x=rnd(Q.pool);if(x!==code&&!dist.includes(x))dist.push(x);}
    opts=shuffle([code,...dist]);
  }
  return {kind,code,opts};
}

function nextQ(){
  clearMarks(); awaiting=null;
  if(Q.i>=Q.n){ return showResult(); }
  Q.cur=makeQ(); Q.i++;
  const q=Q.cur;
  const texts={
    pointCountry:['Wskaż na mapie państwo:','Kliknij jego obszar na mapie'],
    pointCapital:['Wskaż na mapie stolicę państwa:','Kliknij czerwoną kropkę we właściwym miejscu'],
    nameCountry:['Jak nazywa się podświetlone państwo?','Popatrz na pomarańczowy kształt na mapie'],
    nameCapital:['Jaka jest stolica tego państwa?','Państwo jest podświetlone na mapie']
  };
  const head=texts[q.kind];
  let title = q.kind==='pointCountry' ? nameOf(q.code)
            : q.kind==='pointCapital' ? nameOf(q.code)
            : q.kind==='nameCapital' ? nameOf(q.code) : '';
  qBox.innerHTML=`
    <div class="qhead"><span>Pytanie ${Q.i} z ${Q.n}</span><span>Punkty: ${Q.score}</span></div>
    <div class="bar"><div style="width:${(Q.i-1)/Q.n*100}%"></div></div>
    <p id="qText">${head[0]}${title?' <span style="color:#2f7fb5">'+title+'</span>':''}</p>
    <p id="qSub">${head[1]}</p>
    <div class="opts" id="qOpts"></div>
    <div id="feedback"></div>
    <div id="qNav"></div>`;
  if(q.kind==='nameCountry'||q.kind==='nameCapital'){
    markCountry(q.code,'reveal');
    if(byCode[q.code].area<2600) zoomTo(q.code,260);
    const box=$('#qOpts');
    q.opts.forEach(c=>{
      const b=document.createElement('button');
      b.textContent = q.kind==='nameCountry'?nameOf(c):capOf(c);
      b.onclick=()=>answer(c===q.code,c,b);
      box.appendChild(b);
    });
  } else {
    awaiting=q;
    $('#qSub').textContent = byCode[q.code].area<1300
      ? head[1]+'. Uwaga — to bardzo małe państwo, warto przybliżyć mapę!'
      : head[1];
    const skip=document.createElement('button');
    skip.className='btn ghost'; skip.textContent='Nie wiem — pokaż';
    skip.onclick=()=>answer(false,null,null);
    $('#qNav').appendChild(skip);
  }
}

function quizMapClick(capC,cC){
  if(!awaiting) return;
  const q=awaiting;
  if(q.kind==='pointCountry'){
    if(!cC && !capC) return;
    const picked = cC || capC;
    answer(picked===q.code, picked, null);
  } else if(q.kind==='pointCapital'){
    if(!capC) return;
    answer(capC===q.code, capC, null);
  }
}

function answer(correct,picked,btn){
  awaiting=null;
  const q=Q.cur;
  if(correct) Q.score++;
  else Q.wrong.push(q);
  const fb=$('#feedback');
  fb.className = correct?'ok':'bad';
  if(q.kind==='pointCountry'||q.kind==='pointCapital'){
    const el2 = q.kind==='pointCountry'?pathOf:dotOf;
    if(correct){
      if(q.kind==='pointCountry') markCountry(q.code,'ok'); else el2[q.code].classList.add('ok');
    } else {
      if(picked && el2[picked]){
        if(q.kind==='pointCountry') markCountry(picked,'bad'); else el2[picked].classList.add('bad');
      }
      if(q.kind==='pointCountry') markCountry(q.code,'ok'); else el2[q.code].classList.add('ok');
      markCountry(q.code,'reveal');
    }
    labOf[q.code].classList.remove('hidden');
  } else {
    document.querySelectorAll('#qOpts button').forEach(b=>{
      b.disabled=true;
      const txt=b.textContent;
      const good = q.kind==='nameCountry'?nameOf(q.code):capOf(q.code);
      if(txt===good) b.classList.add('ok');
      else if(b===btn) b.classList.add('bad');
    });
  }
  const good = (q.kind==='nameCapital'||q.kind==='pointCapital') ? capOf(q.code) : nameOf(q.code);
  fb.textContent = correct ? '✔ Świetnie!' : '✘ Poprawna odpowiedź: '+good;
  $('#qNav').innerHTML='';
  const b=document.createElement('button');
  b.className='btn'; b.textContent = Q.i>=Q.n?'Zobacz wynik':'Następne pytanie';
  b.onclick=()=>{k=1;tx=0;ty=0;apply();nextQ();};
  $('#qNav').appendChild(b);
}

function showResult(){
  clearMarks();
  const pct=Math.round(Q.score/Q.n*100);
  const msg = pct>=90?'Mistrz geografii! 🏆' : pct>=70?'Bardzo dobrze! 👏' : pct>=50?'Nieźle — jeszcze trochę ćwiczeń.' : 'Poćwicz w trybie Nauka i spróbuj jeszcze raz.';
  const wrongList = Q.wrong.map(q=>{
    const what = (q.kind==='nameCapital'||q.kind==='pointCapital')
      ? `${nameOf(q.code)} → stolica: <b>${capOf(q.code)}</b>`
      : `<b>${nameOf(q.code)}</b> (stolica: ${capOf(q.code)})`;
    return '<li>'+what+'</li>';
  }).join('');
  qBox.innerHTML=`<div id="result">
    <h2>${Q.score} / ${Q.n}</h2>
    <p style="margin:0 0 10px">${msg}</p>
    ${Q.wrong.length?'<p style="margin:0;font-weight:700">Do powtórzenia:</p><ul>'+wrongList+'</ul>':''}
    <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">
      <button class="btn" id="again">Jeszcze raz</button>
      <button class="btn ghost" id="toLearn">Wróć do nauki</button>
    </div></div>`;
  $('#again').onclick=quizSetup;
  $('#toLearn').onclick=()=>setMode('learn');
}

apply();
</script>
</body>
</html>
